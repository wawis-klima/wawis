name: Patch v10.80 review guards

on:
  push:
    branches:
      - release/v10.80

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v10.80
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Detect patched state
        id: state
        shell: bash
        run: |
          if grep -q "stale-session-final-queue-guard-v1080" src/mobile791/hooks/useAppSession.js; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add final race guards
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Brak wzorca: {label}')
              return text.replace(old, new, 1)

          for path in ['src/hooks/useAppSession.js', 'src/mobile791/hooks/useAppSession.js']:
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              s = replace_once(
                  s,
                  '      } catch (serverError) {\n        if (!isJwtExpiredError(serverError)) throw serverError;',
                  '      } catch (serverError) {\n        if (!isCurrentSession()) return { ok: false, ignoredStaleSession: true, coreJobsApplied };\n        if (!isJwtExpiredError(serverError)) throw serverError;',
                  f'{path}: server error pre-refresh guard',
              )
              s = replace_once(
                  s,
                  '        const refreshedUser = refreshedSessionData?.session?.user || null;\n',
                  '        const refreshedUser = refreshedSessionData?.session?.user || null;\n        if (!isCurrentSession()) return { ok: false, ignoredStaleSession: true, coreJobsApplied };\n',
                  f'{path}: refreshed session guard',
              )
              p.write_text(s, encoding='utf-8')

          p = Path('src/mobile791/hooks/useAppSession.js')
          s = p.read_text(encoding='utf-8')
          s = replace_once(
              s,
              '          const operations = await listOfflineJobOperations(userId);\n          const restoredJobs = applyOfflineOperationsToJobs(cached.jobs, operations, cached.profile);',
              '          const operations = await listOfflineJobOperations(userId);\n          if (!isCurrentSession()) return { ok: false, ignoredStaleSession: true };\n          const restoredJobs = applyOfflineOperationsToJobs(cached.jobs, operations, cached.profile);',
              'mobile cache queue guard',
          )
          s = replace_once(
              s,
              "      const operations = await listOfflineJobOperations(String(payload.sessionUser?.id || activeUser?.id || userId));\n      const finalJobs = applyOfflineOperationsToJobs(payload.jobs || coreJobs || [], operations, payload.profile || getProfileFallback(activeUser));",
              "      const operations = await listOfflineJobOperations(String(payload.sessionUser?.id || activeUser?.id || userId));\n      if (!isCurrentSession()) return { ok: false, ignoredStaleSession: true, coreJobsApplied }; // stale-session-final-queue-guard-v1080\n      const finalJobs = applyOfflineOperationsToJobs(payload.jobs || coreJobs || [], operations, payload.profile || getProfileFallback(activeUser));",
              'mobile final queue guard',
          )
          p.write_text(s, encoding='utf-8')

          smoke = Path('scripts/smoke-session-sync-resilience-v1080.mjs')
          t = smoke.read_text(encoding='utf-8')
          anchor = "  assert.match(source, /sessionToken\\.generation/);\n"
          extra = """  assert.match(source, /catch \\(serverError\\) \\{\\n\\s*if \\(!isCurrentSession\\(\\)\\)/);
          assert.match(source, /const refreshedUser = refreshedSessionData\\?\\.session\\?\\.user \\|\\| null;\\n\\s*if \\(!isCurrentSession\\(\\)\\)/);
          """.replace('          ', '')
          if extra.strip() not in t:
              if anchor not in t: raise SystemExit('Brak kotwicy smoke guard')
              t = t.replace(anchor, anchor + extra, 1)
          if "stale-session-final-queue-guard-v1080" not in t:
              t += "\nconst mobileHook = fs.readFileSync('src/mobile791/hooks/useAppSession.js', 'utf8');\nassert.match(mobileHook, /stale-session-final-queue-guard-v1080/);\n"
          smoke.write_text(t, encoding='utf-8')
          PY

      - name: Install dependencies
        if: steps.state.outputs.done != 'true'
        run: npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Verify final guards
        if: steps.state.outputs.done != 'true'
        run: |
          node scripts/smoke-session-sync-resilience-v1080.mjs
          node scripts/smoke-auth-refresh.cjs
          node scripts/smoke-version-ui.cjs

      - name: Commit reviewed guards
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          git config user.name "wawis-klima"
          git config user.email "wasik@wawis.pl"
          git add src/hooks/useAppSession.js src/mobile791/hooks/useAppSession.js scripts/smoke-session-sync-resilience-v1080.mjs
          git commit -m "fix: close remaining v10.80 session await races"
          git push origin HEAD:release/v10.80
