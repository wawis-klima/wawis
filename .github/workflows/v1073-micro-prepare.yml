name: WAWIS 10.73 micro prepare

on:
  push:
    branches: [release/v10.73]

permissions:
  contents: write

concurrency:
  group: wawis-v1073-micro-prepare
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v10.73
          fetch-depth: 0

      - name: Prepare final MICRO UI candidate locally
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main --force
          node version-bump.cjs
          node <<'NODE'
          const fs = require('fs');
          const version = '10.73';
          const description = 'lewy skrajny odstęp mobilnego paska zmniejszono do 1 px; prawa krawędź pozostaje 2,5 px, a odzyskane miejsce zwiększa odstępy pomiędzy kontrolkami.';

          let readme = fs.readFileSync('README.md', 'utf8');
          readme = readme.replace(/## Ostatnia poprawka\s*- wersja\s*`?10\.73`?.*/m, `## Ostatnia poprawka\n- wersja \`10.73\` — ${description}`);
          fs.writeFileSync('README.md', readme);

          let changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          changelog = changelog.replace('- uzupełnij opis zmian dla wersji 10.73', `- ${description}`);
          fs.writeFileSync('CHANGELOG.md', changelog);

          const gate = {
            policy_enforced_from: '10.60',
            version,
            release_mode: 'micro-ui',
            scope: 'mobile',
            release_branch: 'release/v10.73',
            drive_backup: {
              required: false,
              deferred: true,
              folder_path: 'Aplikacja/Wersje',
              folder_id: '1eufcE1gnbfw7t2IMmJwbcicrkaiaqu0S',
              file_name: 'klima-app-v10.73.zip'
            },
            main_protection: {
              source_branch: 'release/v10.73',
              ready_for_main: true,
              required_check: 'WAWIS PR checks / targeted-checks'
            },
            micro_ui: {
              policy_version: 1,
              css_only: true,
              archive_deferred: true,
              effective_files: ['src/mobile791/v1048-runtime-fix.css']
            },
            postdeploy_diagnostics: {
              evidence_required: false,
              result: 'PENDING'
            }
          };
          fs.writeFileSync('RELEASE-GATE.json', JSON.stringify(gate, null, 2) + '\n');
          NODE
          rm -f .github/workflows/v1073-micro-prepare.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "WAWIS 10.73: finalny kandydat MICRO UI"

      - name: Verify final MICRO UI classification
        run: node scripts/micro-ui-policy.cjs --base-ref origin/main --json MICRO-UI-IMPACT.json

      - name: Push prepared release
        run: git push origin HEAD:release/v10.73
