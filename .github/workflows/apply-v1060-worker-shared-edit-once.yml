name: Apply WAWIS 10.60 shared worker edit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-v1060-worker-shared-edit.cjs'
      - '.github/workflows/apply-v1060-worker-shared-edit-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 10.60 patch
        run: node scripts/apply-v1060-worker-shared-edit.cjs

      - name: Targeted regression tests
        run: |
          node scripts/smoke-mobile-new-job-comment-v920.cjs
          node scripts/smoke-mobile-worker-add-client-v919.cjs
          node scripts/smoke-worker-shared-job-edit-v1060.cjs
          node scripts/smoke-auth-refresh.cjs

      - name: Commit final changes
        run: |
          git config user.name "wawis-klima"
          git config user.email "wasik@wawis.pl"
          git rm scripts/apply-v1060-worker-shared-edit.cjs
          git rm .github/workflows/apply-v1060-worker-shared-edit-once.yml
          git add -A
          git commit -m "WAWIS 10.60: pełna edycja aktywnych montaży przez pracowników"
          git push origin main
