name: WAWIS bootstrap 10.78

on:
  push:
    branches:
      - release/v10.78

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v10.78
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply 10.78 patch
        run: |
          python scripts/apply-v1078-patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/release-policy-gate.cjs')
          source = path.read_text()
          old = "assert(rules.includes('POST-DEPLOY EVIDENCE'), 'NO-GO: WAWIS-RULES.md nie opisuje dowodu post-deploy');"
          new = "assert(rules.includes('zielony deployment Vercela'), 'NO-GO: WAWIS-RULES.md nie wymaga zielonego deploymentu Vercela');"
          if old not in source:
              raise SystemExit('Brak starej asercji post-deploy w release-policy-gate.cjs')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Run focused 10.78 regressions
        run: |
          node scripts/smoke-push-safety-v1078.mjs
          npm run test:smoke:push-logout-handoff
          node scripts/smoke-release-impact-v1063.cjs
          node scripts/release-policy-gate.cjs
      - name: Commit tested patch
        run: |
          git config user.name "wawis-klima"
          git config user.email "wasik@wawis.pl"
          git rm scripts/apply-v1078-patch.py
          git add -A ':!.github/workflows/bootstrap-v1078.yml' ':!.github/workflows/release-checks.yml'
          git commit -m "Release 10.78: atomic mobile push lifecycle and faster release gate"
          git push origin HEAD:release/v10.78
