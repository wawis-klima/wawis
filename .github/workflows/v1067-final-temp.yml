name: WAWIS 10.67 final temp

on:
  push:
    branches:
      - release/v10.67
    paths:
      - .github/workflows/v1067-final-temp.yml

permissions:
  contents: write

env:
  TEMP_WORKFLOW: .github/workflows/v1067-final-temp.yml

jobs:
  final-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temp workflow from release filesystem
        run: rm -f "$TEMP_WORKFLOW"

      - name: Fetch production base
        run: git fetch origin main:refs/remotes/origin/main --force

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Pre-release policy gate
        run: node scripts/release-policy-gate.cjs

      - name: Detect automatic release profile
        run: node scripts/release-impact.cjs --base-ref origin/main --json RELEASE-IMPACT.json

      - name: Require CRITICAL profile for release infrastructure change
        run: node -e "const i=require('./RELEASE-IMPACT.json'); if(i.profile!=='critical'||i.scope!=='full'||!i.needs_playwright) { console.error(i); process.exit(1); }"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run one full automatic release pass
        run: node scripts/run-release.cjs auto --base-ref origin/main --skip-version-bump

      - name: Upload final ZIP and release evidence
        uses: actions/upload-artifact@v4
        with:
          name: wawis-final-release-v10.67
          path: |
            releases/klima-app-v10.67.zip
            RELEASE-RESULT.md
            RELEASE-IMPACT.json
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 30

      - name: Commit temp workflow removal after successful release
        run: |
          git config user.name 'wawis-klima'
          git config user.email 'wasik@wawis.pl'
          git add -u "$TEMP_WORKFLOW"
          git commit -m 'WAWIS 10.67: usuń jednorazowy final workflow'
          git push origin HEAD:release/v10.67
