name: WAWIS 10.85 one-shot version bump

on:
  push:
    branches:
      - audit-fixes-10.85
    paths:
      - .github/workflows/version-bump-1085.yml

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit-fixes-10.85
          fetch-depth: 0

      - name: Finalize version 10.85 metadata
        run: |
          node version-bump.cjs
          node <<'NODE'
          const fs = require('node:fs');
          const readmePath = 'README.md';
          const changelogPath = 'CHANGELOG.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          readme = readme.replace(
            /## Ostatnia poprawka\s*- wersja\s*`?10\.85`?.*/m,
            '## Ostatnia poprawka\n- wersja `10.85` — bramka wydawania po audycie 10.84: fail-closed CI, wymagane E2E i build, twarda autoryzacja AI, zabezpieczony webhook SMSAPI oraz baseline produkcyjnego Supabase.'
          );
          fs.writeFileSync(readmePath, readme);

          let changelog = fs.readFileSync(changelogPath, 'utf8');
          changelog = changelog.replace(
            /^## 10\.85\n- uzupełnij opis zmian dla wersji 10\.85\n/m,
            '## 10.85\n- F12/N9: fail-closed Playwright runners, wymagany production build w PR gate, cross-platform ZIP i poprawki CRLF/Windows.\n- N1: OCR AI ufa wyłącznie chronionej roli `profiles.role`.\n- N6: uwierzytelniony callback SMSAPI, monotoniczne statusy i kontrola błędów zapisu.\n- N7-A: repo zawiera baseline żywych guardów produkcyjnych oraz aktualny kod `send-service-sms`.\n'
          );
          fs.writeFileSync(changelogPath, changelog);
          NODE

      - name: Verify version consistency
        run: node scripts/smoke-version-ui.cjs

      - name: Commit finalized version
        run: |
          git config user.name "wawis-klima"
          git config user.email "wasik@wawis.pl"
          git add app-version.json public/app-version.json package.json package-lock.json src/version.js src/mobile791/version.js public/push-sw.js README.md CHANGELOG.md
          git commit -m "10.85: finalize version metadata"
          git push origin HEAD:audit-fixes-10.85
