name: Fix v10.80 Playwright invocation

on:
  push:
    branches:
      - release/v10.80

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v10.80
          fetch-depth: 0

      - name: Fix command and remove fixer
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/apply-v1080.yml')
          s = p.read_text(encoding='utf-8')
          old = 'npx playwright test tests/e2e/mobile-offline-atomic-v1075.spec.js --project=chromium'
          new = 'npx playwright test tests/e2e/mobile-offline-atomic-v1075.spec.js'
          if old not in s:
              raise SystemExit('Nie znaleziono starej komendy Playwright')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-v1080-playwright.yml').unlink()
          PY
          git config user.name "wawis-klima"
          git config user.email "wasik@wawis.pl"
          git add -A
          git commit -m "ci: run v10.80 IndexedDB test with default Playwright project"
          git push origin HEAD:release/v10.80
