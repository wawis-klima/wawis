name: Fix v10.83 late refresh photo race

on:
  push:
    branches:
      - tmp-v1083-apply

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-v1083-apply
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Preserve latest queued photos when an older refresh completes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fetch_path = Path('src/mobile791/modules/jobs-fetch.js')
          text = fetch_path.read_text()
          marker = """function buildCombinedJobs({ jobsData, accessData, existingJobs = [], preserveJobDetails = true }) {\n"""
          helper = """export function preserveLatestQueuedPhotos(incomingJobs = [], latestJobs = []) {\n  const latestQueuedByJob = new Map((latestJobs || []).map((job) => [\n    String(job?.id || ''),\n    (Array.isArray(job?.photos) ? job.photos : []).filter((photo) => isLocalQueuedPhoto(photo)),\n  ]).filter(([id, photos]) => id && photos.length));\n\n  return (incomingJobs || []).map((job) => {\n    const queuedPhotos = latestQueuedByJob.get(String(job?.id || '')) || [];\n    if (!queuedPhotos.length) return job;\n    const merged = new Map((Array.isArray(job?.photos) ? job.photos : []).map((photo) => [String(photo?.id || ''), photo]));\n    for (const photo of queuedPhotos) merged.set(String(photo.id), photo);\n    return { ...job, photos: [...merged.values()] };\n  });\n}\n\n"""
          if 'export function preserveLatestQueuedPhotos' not in text:
              if marker not in text:
                  raise SystemExit('buildCombinedJobs marker missing')
              text = text.replace(marker, helper + marker, 1)
          fetch_path.write_text(text)

          jobs_path = Path('src/mobile791/modules/jobs.js')
          jobs = jobs_path.read_text()
          old = "export { refreshAppData, loadJobDetailsData, loadJobNameplatePhotosData, loadJobSummaryData } from './jobs-fetch.js';"
          new = "export { refreshAppData, loadJobDetailsData, loadJobNameplatePhotosData, loadJobSummaryData, preserveLatestQueuedPhotos } from './jobs-fetch.js';"
          if old in jobs:
              jobs = jobs.replace(old, new, 1)
          elif 'preserveLatestQueuedPhotos' not in jobs:
              raise SystemExit('jobs.js export marker missing')
          jobs_path.write_text(jobs)

          session_path = Path('src/mobile791/hooks/useAppSession.js')
          session = session_path.read_text()
          old = 'import { loadJobSummaryData, refreshAppData } from "../modules/jobs.js";'
          new = 'import { loadJobSummaryData, preserveLatestQueuedPhotos, refreshAppData } from "../modules/jobs.js";'
          if old in session:
              session = session.replace(old, new, 1)
          elif 'preserveLatestQueuedPhotos' not in session.split('\n', 20)[0:20]:
              pass

          old = """        const nextJobs = applyOfflineOperationsToJobs(freshJobs, operations, profileForOffline);\n"""
          new = """        const freshJobsWithLatestQueue = preserveJobDetails\n          ? preserveLatestQueuedPhotos(freshJobs, jobsRef.current)\n          : freshJobs;\n        const nextJobs = applyOfflineOperationsToJobs(freshJobsWithLatestQueue, operations, profileForOffline);\n"""
          if old in session:
              session = session.replace(old, new, 1)
          elif 'freshJobsWithLatestQueue' not in session:
              raise SystemExit('applyJobsFirst marker missing')

          old = """      const finalJobs = applyOfflineOperationsToJobs(payload.jobs || coreJobs || [], operations, payload.profile || getProfileFallback(activeUser));\n"""
          new = """      const payloadJobs = payload.jobs || coreJobs || [];\n      const payloadJobsWithLatestQueue = preserveJobDetails\n        ? preserveLatestQueuedPhotos(payloadJobs, jobsRef.current)\n        : payloadJobs;\n      const finalJobs = applyOfflineOperationsToJobs(payloadJobsWithLatestQueue, operations, payload.profile || getProfileFallback(activeUser));\n"""
          if old in session:
              session = session.replace(old, new, 1)
          elif 'payloadJobsWithLatestQueue' not in session:
              raise SystemExit('finalJobs marker missing')
          session_path.write_text(session)

          smoke_path = Path('scripts/smoke-mobile-offline-photo-queue.cjs')
          smoke = smoke_path.read_text()
          if "const sessionHook = fs.readFileSync(path.join(root, 'src/mobile791/hooks/useAppSession.js'), 'utf8');" not in smoke:
              smoke = smoke.replace(
                  "const jobsFetch = fs.readFileSync(path.join(root, 'src/mobile791/modules/jobs-fetch.js'), 'utf8');\n",
                  "const jobsFetch = fs.readFileSync(path.join(root, 'src/mobile791/modules/jobs-fetch.js'), 'utf8');\nconst sessionHook = fs.readFileSync(path.join(root, 'src/mobile791/hooks/useAppSession.js'), 'utf8');\n",
                  1,
              )
          additions = [
              "assert(jobsFetch.includes('export function preserveLatestQueuedPhotos'), 'Brak ochrony lokalnej kolejki przed spóźnionym pełnym refreshem.');\n",
              "assert(sessionHook.includes('preserveLatestQueuedPhotos(freshJobs, jobsRef.current)'), 'Pierwsza odpowiedź serwera musi scalić najnowszą kolejkę zdjęć.');\n",
              "assert(sessionHook.includes('preserveLatestQueuedPhotos(payloadJobs, jobsRef.current)'), 'Końcowa odpowiedź serwera nie może nadpisać zdjęcia odtworzonego po starcie requestu.');\n",
          ]
          anchor = "assert(app.includes('offlinePhotoQueueUserRef.current !== userId && hasJobsReady'), 'Kolejka nie może zostać oznaczona jako odtworzona przed załadowaniem zleceń.');\n"
          for addition in additions:
              if addition not in smoke:
                  smoke = smoke.replace(anchor, anchor + addition, 1)
                  anchor = addition
          smoke_path.write_text(smoke)
          PY
          git diff --check
      - run: npm ci --include=optional --registry=https://registry.npmjs.org/
      - name: Focused smoke
        run: node scripts/smoke-mobile-offline-photo-queue.cjs
      - run: npx playwright install --with-deps chromium
      - name: Re-run the real failing scenario
        run: npx playwright test tests/e2e/mobile-resilience.spec.js --workers=1 --reporter=line
      - name: Commit verified fix
        run: |
          git config user.name 'wawis-klima'
          git config user.email 'wasik@wawis.pl'
          git add src/mobile791/modules/jobs-fetch.js src/mobile791/modules/jobs.js src/mobile791/hooks/useAppSession.js scripts/smoke-mobile-offline-photo-queue.cjs
          git commit -m 'fix: keep queued photos across late session refresh'
          git push origin HEAD:tmp-v1083-apply
