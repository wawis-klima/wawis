name: WAWIS WebKit E2E (built app)

# Te same E2E co dla Chromium, ale w silniku WebKit (Safari) z profilem iPhone'a.
# Na razie check informacyjny (nie blokuje scalenia); po tygodniu stabilnych wyników — wymagany.
# Tylko odczyt repozytorium, bez sekretów, mock Supabase, bez wdrożenia.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: wawis-webkit-built-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  webkit-built-e2e:
    name: webkit-built-e2e
    runs-on: ubuntu-24.04  # 13.80: przypięte — GitHub przenosi ubuntu-latest na Ubuntu 26 (od 19.10.2026)
    timeout-minutes: 45
    # 13.82: gotowy obraz Playwright z WebKit i bibliotekami systemowymi — bez apt-get (install-deps
    # potrafił wisieć do 25 min). Wersja obrazu = wersja playwright-core z package-lock.json (krok kontrolny).
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001
    env:
      PLAYWRIGHT_IMAGE_VERSION: '1.60.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Playwright version must match the container image
        run: |
          node --version
          locked="$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")"
          if [ "$locked" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::playwright-core $locked w package-lock.json, obraz $PLAYWRIGHT_IMAGE_VERSION — zaktualizuj image i PLAYWRIGHT_IMAGE_VERSION w webkit-built-e2e.yml"
            exit 1
          fi

      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Run E2E in WebKit (iPhone profile, mock Supabase)
        env:
          VITE_SUPABASE_MODE: mock
        run: npx playwright test --config playwright.webkit-built.config.js

      - name: Verify WebKit E2E evidence (fail-closed)
        if: always()
        run: node scripts/verify-built-photo-queue-e2e.cjs playwright-report-webkit/results.json 20  # 14.02: +1 test kart zdjęć serwisu

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wawis-webkit-built-e2e-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report-webkit/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
