name: WAWIS diag — precache offline ×6

# TYMCZASOWY (13.76): powtarzalność testu pełnego pobrania wersji i treść błędów. Bez sekretów, bez wdrożenia. Usunąć przed scaleniem.
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/diag-precache.yml']

permissions:
  contents: read

jobs:
  diag-precache:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=optional --registry=https://registry.npmjs.org/
      - timeout-minutes: 6
        run: npx playwright install chromium --only-shell
      - name: Precache ×6 (bez ponowień)
        env:
          VITE_SUPABASE_MODE: mock
        run: npx playwright test --config playwright.built.config.js tests/e2e/mobile-precache-offline-v1376.spec.js --repeat-each=6 --retries=0 || true
      - name: Adnotacje
        if: always()
        run: |
          node -e '
          const r=require("./playwright-report-built/results.json");const out=[];let total=0;
          const walk=(s)=>{for(const sp of s.specs||[])for(const t of sp.tests||[])for(const l of t.results||[]){total++;if(l.status!=="passed"){const e=[l.error?.message,...(l.errors||[]).map(x=>x?.message)].filter(Boolean).join(" || ").replace(/\u001b\[[0-9;]*m/g,"").replace(/\s+/g," ").slice(0,1500);out.push(`[${l.status}] ${e}`)}};for(const c of s.suites||[])walk(c)};
          for(const s of r.suites||[])walk(s);
          for(const line of out)console.log(`::error title=Diag precache::${line.replace(/%/g,"%25")}`);
          console.log(`::notice title=Diag precache::próby=${total} niezaliczone=${out.length}`);'
