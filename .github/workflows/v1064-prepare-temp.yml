name: WAWIS 10.64 prepare

on:
  push:
    branches:
      - release/v10.64
    paths:
      - .github/workflows/v1064-prepare-temp.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v10.64
          fetch-depth: 0

      - name: Bump version once
        run: node version-bump.cjs

      - name: Commit version metadata
        run: |
          git config user.name "wawis-klima"
          git config user.email "wasik@wawis.pl"
          git add app-version.json public/app-version.json package.json package-lock.json src/version.js src/mobile791/version.js public/push-sw.js README.md CHANGELOG.md
          git commit -m "WAWIS 10.64 — synchronizuj wersję"
          git push origin HEAD:release/v10.64
