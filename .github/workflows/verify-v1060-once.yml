name: Verify WAWIS 10.60 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-v1060-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Verify mobile protocol with full output
        run: node scripts/smoke-mobile-protocol-v979.cjs

      - name: Full release verification without version bump
        run: node scripts/run-release.cjs full --skip-version-bump

      - name: Upload release package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wawis-10.60-release
          path: |
            releases/klima-app-v10.60.zip
            RELEASE-RESULT.md
          if-no-files-found: error
          retention-days: 7

# rerun: 15
