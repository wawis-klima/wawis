name: Prepare v10.82 audit fixes

on:
  push:
    branches:
      - release/v10.82

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v10.82
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify starting point
        shell: bash
        run: |
          test "$(node -p "require('./app-version.json').version")" = "10.81"

      - name: Apply F1 F2 F13 fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_exact(path, old, new, expected=1):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old[:120]!r}')
              write(path, text.replace(old, new))

          guard = r'''const activeReloadBlockers = new Set();
          const activeBeforeUnloadWarnings = new Set();
          let pendingReload = null;
          let reloadTimerId = null;
          let beforeUnloadInstalled = false;

          function getWindow() {
            return typeof window !== 'undefined' ? window : null;
          }

          function dispatchGuardEvent(type, detail = {}) {
            const windowRef = getWindow();
            if (!windowRef?.dispatchEvent || typeof CustomEvent === 'undefined') return;
            try {
              windowRef.dispatchEvent(new CustomEvent(type, { detail }));
            } catch {
              // Telemetria UI nie może wpływać na ochronę niezapisanej pracy.
            }
          }

          function handleBeforeUnload(event) {
            if (!activeBeforeUnloadWarnings.size) return undefined;
            event?.preventDefault?.();
            if (event) event.returnValue = '';
            return '';
          }

          function syncBeforeUnloadGuard() {
            const windowRef = getWindow();
            if (!windowRef?.addEventListener || !windowRef?.removeEventListener) return;

            if (activeBeforeUnloadWarnings.size > 0 && !beforeUnloadInstalled) {
              windowRef.addEventListener('beforeunload', handleBeforeUnload);
              beforeUnloadInstalled = true;
              return;
            }

            if (activeBeforeUnloadWarnings.size === 0 && beforeUnloadInstalled) {
              windowRef.removeEventListener('beforeunload', handleBeforeUnload);
              beforeUnloadInstalled = false;
            }
          }

          function rememberPendingReload(reason) {
            if (!pendingReload) {
              pendingReload = {
                reason: String(reason || 'update'),
                requestedAt: Date.now(),
              };
            }
            return pendingReload;
          }

          function scheduleReload(reason, delayMs = 0) {
            const windowRef = getWindow();
            if (!windowRef?.location || typeof windowRef.location.reload !== 'function') return false;
            if (reloadTimerId !== null) return true;

            const safeReason = String(reason || 'update');
            pendingReload = null;
            const safeDelay = Math.max(0, Number(delayMs) || 0);
            const schedule = typeof windowRef.setTimeout === 'function'
              ? windowRef.setTimeout.bind(windowRef)
              : setTimeout;

            reloadTimerId = schedule(() => {
              reloadTimerId = null;
              if (activeReloadBlockers.size > 0) {
                const deferred = rememberPendingReload(safeReason);
                dispatchGuardEvent('wawis:update-reload-deferred', {
                  reason: deferred.reason,
                  blockers: activeReloadBlockers.size,
                });
                return;
              }
              pendingReload = null;
              dispatchGuardEvent('wawis:update-reload-start', { reason: safeReason });
              windowRef.location.reload();
            }, safeDelay);
            return true;
          }

          function createToken(set, reason) {
            const token = Symbol(String(reason || 'unsaved-work'));
            set.add(token);
            let released = false;
            return {
              token,
              release() {
                if (released) return false;
                released = true;
                set.delete(token);
                return true;
              },
            };
          }

          export function blockUpdateReload(reason = 'unsaved-work') {
            const blocker = createToken(activeReloadBlockers, reason);
            dispatchGuardEvent('wawis:update-reload-blocked', {
              reason,
              blockers: activeReloadBlockers.size,
            });

            return () => {
              if (!blocker.release()) return;
              dispatchGuardEvent('wawis:update-reload-unblocked', {
                reason,
                blockers: activeReloadBlockers.size,
              });

              if (activeReloadBlockers.size === 0 && pendingReload && reloadTimerId === null) {
                const deferred = pendingReload;
                pendingReload = null;
                scheduleReload(deferred.reason, 0);
              }
            };
          }

          export function blockBeforeUnload(reason = 'unsaved-work') {
            const warning = createToken(activeBeforeUnloadWarnings, reason);
            syncBeforeUnloadGuard();
            return () => {
              if (!warning.release()) return;
              syncBeforeUnloadGuard();
            };
          }

          export function blockUnsavedWork(reason = 'unsaved-work') {
            const releaseReload = blockUpdateReload(reason);
            const releaseBeforeUnload = blockBeforeUnload(reason);
            let released = false;
            return () => {
              if (released) return;
              released = true;
              releaseBeforeUnload();
              releaseReload();
            };
          }

          export function requestUpdateReload(reason = 'update', { delayMs = 0 } = {}) {
            if (activeReloadBlockers.size > 0) {
              const deferred = rememberPendingReload(reason);
              dispatchGuardEvent('wawis:update-reload-deferred', {
                reason: deferred.reason,
                blockers: activeReloadBlockers.size,
              });
              return false;
            }

            return scheduleReload(String(reason || 'update'), delayMs);
          }

          export function hasUpdateReloadBlockers() {
            return activeReloadBlockers.size > 0;
          }

          export function getUpdateReloadGuardState() {
            return {
              blockers: activeReloadBlockers.size,
              beforeUnloadWarnings: activeBeforeUnloadWarnings.size,
              pending: Boolean(pendingReload),
              pendingReason: pendingReload?.reason || '',
              reloadScheduled: reloadTimerId !== null,
            };
          }

          export function __resetUpdateReloadGuardForTests() {
            const windowRef = getWindow();
            if (reloadTimerId !== null) {
              const clear = typeof windowRef?.clearTimeout === 'function'
                ? windowRef.clearTimeout.bind(windowRef)
                : clearTimeout;
              try { clear(reloadTimerId); } catch { /* tylko testy */ }
            }
            activeReloadBlockers.clear();
            activeBeforeUnloadWarnings.clear();
            pendingReload = null;
            reloadTimerId = null;
            syncBeforeUnloadGuard();
          }
          '''
          # Dedent literal kept visually aligned with workflow Python block.
          import textwrap
          write('src/modules/update-reload-guard.js', textwrap.dedent(guard))

          desktop_modal = r'''import React, { useEffect } from "react";
          import { createPortal } from "react-dom";
          import { blockBeforeUnload, blockUpdateReload } from "../../modules/update-reload-guard.js";

          export default function AppModal({
            open,
            onClose,
            children,
            overlayClassName = "",
            contentClassName = "card modal",
            closeOnOverlay = true,
            closeOnEscape = true,
            warnBeforeUnload = false,
          }) {
            useEffect(() => {
              if (!open || typeof document === "undefined") return undefined;
              return blockUpdateReload("desktop-app-modal");
            }, [open]);

            useEffect(() => {
              if (!open || !warnBeforeUnload || typeof document === "undefined") return undefined;
              return blockBeforeUnload("desktop-app-modal-unsaved-work");
            }, [open, warnBeforeUnload]);

            useEffect(() => {
              if (!open || typeof document === "undefined") return undefined;

              const previousOverflow = document.body.style.overflow;
              document.body.style.overflow = "hidden";

              const handleKeyDown = (event) => {
                if (event.key === "Escape" && closeOnEscape) {
                  onClose?.();
                }
              };

              document.addEventListener("keydown", handleKeyDown);

              return () => {
                document.body.style.overflow = previousOverflow;
                document.removeEventListener("keydown", handleKeyDown);
              };
            }, [closeOnEscape, onClose, open]);

            if (!open) return null;

            const modalContent = (
              <div
                className={`overlay appModalOverlay ${overlayClassName}`.trim()}
                onMouseDown={(event) => {
                  if (closeOnOverlay && event.target === event.currentTarget) {
                    onClose?.();
                  }
                }}
                role="presentation"
              >
                <div
                  className={contentClassName}
                  role="dialog"
                  aria-modal="true"
                  onMouseDown={(event) => event.stopPropagation()}
                >
                  {children}
                </div>
              </div>
            );

            if (typeof document === "undefined") {
              return modalContent;
            }

            return createPortal(modalContent, document.body);
          }
          '''
          write('src/components/modals/AppModal.jsx', textwrap.dedent(desktop_modal))

          mobile_modal = r'''import React, { useEffect } from "react";
          import { createPortal } from "react-dom";
          import { blockBeforeUnload, blockUpdateReload } from "../../../modules/update-reload-guard.js";

          export default function AppModal({
            open,
            onClose,
            children,
            overlayClassName = "",
            contentClassName = "card modal",
            contentRef = null,
            closeOnOverlay = true,
            closeOnEscape = true,
            overlayStyle = undefined,
            contentStyle = undefined,
            warnBeforeUnload = false,
          }) {
            useEffect(() => {
              if (!open || typeof document === "undefined") return undefined;
              return blockUpdateReload("mobile-app-modal");
            }, [open]);

            useEffect(() => {
              if (!open || !warnBeforeUnload || typeof document === "undefined") return undefined;
              return blockBeforeUnload("mobile-app-modal-unsaved-work");
            }, [open, warnBeforeUnload]);

            useEffect(() => {
              if (!open || typeof document === "undefined") return undefined;

              const previousOverflow = document.body.style.overflow;
              document.body.style.overflow = "hidden";

              const handleKeyDown = (event) => {
                if (event.key === "Escape" && closeOnEscape) {
                  onClose?.();
                }
              };

              document.addEventListener("keydown", handleKeyDown);

              return () => {
                document.body.style.overflow = previousOverflow;
                document.removeEventListener("keydown", handleKeyDown);
              };
            }, [closeOnEscape, onClose, open]);

            if (!open) return null;

            const modalContent = (
              <div
                className={`overlay appModalOverlay ${overlayClassName}`.trim()}
                style={overlayStyle}
                onMouseDown={(event) => {
                  if (closeOnOverlay && event.target === event.currentTarget) {
                    onClose?.();
                  }
                }}
                role="presentation"
              >
                <div
                  ref={contentRef}
                  className={contentClassName}
                  style={contentStyle}
                  role="dialog"
                  aria-modal="true"
                  onMouseDown={(event) => event.stopPropagation()}
                >
                  {children}
                </div>
              </div>
            );

            if (typeof document === "undefined") {
              return modalContent;
            }

            return createPortal(modalContent, document.body);
          }
          '''
          write('src/mobile791/components/modals/AppModal.jsx', textwrap.dedent(mobile_modal))

          for hook in ['src/hooks/useJobFormModal.js', 'src/mobile791/hooks/useJobFormModal.js']:
              replace_exact(
                  hook,
                  '  const jobFormRef = useRef(emptyJobForm);\n  const jobFormInitialRef = useRef(emptyJobForm);\n\n  function setJobForm(nextValue) {',
                  '  const jobFormRef = useRef(emptyJobForm);\n  const jobFormInitialRef = useRef(emptyJobForm);\n  const jobFormDirty = getComparableJobForm(jobForm, normalizeStatus) !== getComparableJobForm(jobFormInitialRef.current, normalizeStatus);\n\n  function setJobForm(nextValue) {'
              )
              replace_exact(hook, '    jobForm,\n    jobFormRef,', '    jobForm,\n    jobFormDirty,\n    jobFormRef,')

          for app in ['src/App.jsx', 'src/mobile791/App.jsx']:
              replace_exact(app, '    jobForm,\n    jobFormRef,', '    jobForm,\n    jobFormDirty,\n    jobFormRef,')
              replace_exact(app, '          jobForm={jobForm}\n          setJobForm={setJobForm}', '          jobForm={jobForm}\n          jobFormDirty={jobFormDirty}\n          setJobForm={setJobForm}')

          for form in ['src/components/modals/JobFormModal.jsx', 'src/mobile791/components/modals/JobFormModal.jsx']:
              replace_exact(form, '  jobForm,\n  setJobForm,', '  jobForm,\n  jobFormDirty = false,\n  setJobForm,')
              text = read(form)
              count = text.count('open={showModal}\n')
              if count != 2:
                  raise SystemExit(f'{form}: expected 2 showModal AppModal openings, found {count}')
              text = text.replace('open={showModal}\n', 'open={showModal}\n        warnBeforeUnload={Boolean(jobFormDirty || busy)}\n')
              write(form, text)

          fuel = 'src/components/fuel/FuelPanelBase.jsx'
          replace_exact(fuel, "import { readOdometerPhoto } from '../../modules/fuel-odometer-reader.js';", "import { readOdometerPhoto } from '../../modules/fuel-odometer-reader.js';\nimport { blockUnsavedWork } from '../../modules/update-reload-guard.js';")
          replace_exact(fuel, "  const [busy, setBusy] = useState(false);\n  const [loading, setLoading] = useState(true);", "  const [busy, setBusy] = useState(false);\n  const [entrySaveInProgress, setEntrySaveInProgress] = useState(false);\n  const [loading, setLoading] = useState(true);")
          replace_exact(fuel, "  const monthlyReport = useMemo(\n    () => calculateFuelMonthlyReport({ entries, vehicles, monthKey: reportMonth }),\n    [entries, reportMonth, vehicles],\n  );\n\n  const refresh", "  const monthlyReport = useMemo(\n    () => calculateFuelMonthlyReport({ entries, vehicles, monthKey: reportMonth }),\n    [entries, reportMonth, vehicles],\n  );\n  const entryHasUnsavedWork = Boolean(\n    String(liters).trim()\n    || String(odometerKm).trim()\n    || odometerPhotoBlob\n    || readingOdometer\n    || entrySaveInProgress\n  );\n\n  const refresh")
          replace_exact(fuel, "  useEffect(() => {\n    const timerId = window.setInterval(() => setNow(new Date()), 30000);\n    return () => window.clearInterval(timerId);\n  }, []);\n\n  function resetOdometerPhoto()", "  useEffect(() => {\n    const timerId = window.setInterval(() => setNow(new Date()), 30000);\n    return () => window.clearInterval(timerId);\n  }, []);\n  useEffect(() => {\n    if (!entryHasUnsavedWork) return undefined;\n    return blockUnsavedWork('fuel-entry-draft');\n  }, [entryHasUnsavedWork]);\n\n  function resetOdometerPhoto()")
          replace_exact(fuel, "  async function handleSubmit(event) {\n    event.preventDefault();\n    setBusy(true);", "  async function handleSubmit(event) {\n    event.preventDefault();\n    setEntrySaveInProgress(true);\n    setBusy(true);")
          replace_exact(fuel, "      logDiagnostic('fuel.save.failed', { module: 'fuel', error: saveError });\n    } finally {\n      setBusy(false);\n    }\n  }\n\n  function handleToggleCapacityEditor()", "      logDiagnostic('fuel.save.failed', { module: 'fuel', error: saveError });\n    } finally {\n      setBusy(false);\n      setEntrySaveInProgress(false);\n    }\n  }\n\n  function handleToggleCapacityEditor()")

          desktop_details = 'src/components/JobDetailsPanel.jsx'
          replace_exact(desktop_details, 'import { getJobDeviceRows } from "../modules/job-devices.js";', 'import { getJobDeviceRows } from "../modules/job-devices.js";\nimport { blockUnsavedWork } from "../modules/update-reload-guard.js";')
          replace_exact(desktop_details, "}) {\n  if (!selectedJob) {", "}) {\n  const selectedJobId = String(selectedJob?.id || '');\n  const currentCommentDraft = selectedJobId ? String(commentDrafts?.[selectedJobId] || '') : '';\n  const [commentSaving, setCommentSaving] = React.useState(false);\n  const commentHasUnsavedWork = Boolean(selectedJobId && (currentCommentDraft.trim() || commentSaving));\n\n  React.useEffect(() => {\n    setCommentSaving(false);\n  }, [selectedJobId]);\n\n  React.useEffect(() => {\n    if (!commentHasUnsavedWork) return undefined;\n    return blockUnsavedWork(`desktop-job-comment:${selectedJobId}`);\n  }, [commentHasUnsavedWork, selectedJobId]);\n\n  async function handleAddComment() {\n    if (!selectedJobId || commentSaving) return;\n    setCommentSaving(true);\n    try {\n      await addComment?.(selectedJobId, 'Komentarz');\n    } finally {\n      setCommentSaving(false);\n    }\n  }\n\n  if (!selectedJob) {")
          replace_exact(desktop_details, '  const currentCommentDraft = commentDrafts[selectedJob.id] || "";\n  const canSubmitComment = canAddSelectedJobComment && !busy && currentCommentDraft.trim().length > 0;', '  const canSubmitComment = canAddSelectedJobComment && !busy && !commentSaving && currentCommentDraft.trim().length > 0;')
          replace_exact(desktop_details, '<button className="btn premiumActionBtn commentAddBtn" onClick={() => addComment(selectedJob.id, "Komentarz")} disabled={!canSubmitComment}>Dodaj komentarz</button>', '<button className="btn premiumActionBtn commentAddBtn" onClick={() => void handleAddComment()} disabled={!canSubmitComment}>Dodaj komentarz</button>')

          mobile_details = 'src/mobile791/components/JobDetailsPanel.jsx'
          replace_exact(mobile_details, 'import { formatStoredProtocolDate, loadJobProtocolRecord } from "../modules/job-protocol-storage.js";', 'import { formatStoredProtocolDate, loadJobProtocolRecord } from "../modules/job-protocol-storage.js";\nimport { blockUnsavedWork } from "../../modules/update-reload-guard.js";')
          replace_exact(mobile_details, '  const [expandedDeviceIndexes, setExpandedDeviceIndexes] = React.useState([]);\n  const selectedJobId = String(selectedJob?.id || "");', '  const [expandedDeviceIndexes, setExpandedDeviceIndexes] = React.useState([]);\n  const [commentSaving, setCommentSaving] = React.useState(false);\n  const selectedJobId = String(selectedJob?.id || "");\n  const currentCommentDraft = selectedJobId ? String(commentDrafts?.[selectedJobId] || "") : "";\n  const commentHasUnsavedWork = Boolean(selectedJobId && (currentCommentDraft.trim() || commentSaving));')
          replace_exact(mobile_details, '  React.useEffect(() => {\n    setExpandedDeviceIndexes([]);\n  }, [selectedJobId]);', '  React.useEffect(() => {\n    setExpandedDeviceIndexes([]);\n    setCommentSaving(false);\n  }, [selectedJobId]);\n\n  React.useEffect(() => {\n    if (!commentHasUnsavedWork) return undefined;\n    return blockUnsavedWork(`mobile-job-comment:${selectedJobId}`);\n  }, [commentHasUnsavedWork, selectedJobId]);')
          replace_exact(mobile_details, '  const currentCommentDraft = commentDrafts[selectedJob.id] || "";\n  const canSubmitComment = canAddSelectedJobComment && !busy && currentCommentDraft.trim().length > 0;', '  const canSubmitComment = canAddSelectedJobComment && !busy && !commentSaving && currentCommentDraft.trim().length > 0;')
          replace_exact(mobile_details, "  const singleDeviceTypeLabel = jobDevices.length === 1 ? (singleDeviceIndoorUnits.length > 1 ? 'Multi-split' : 'Single-split') : '';\n\n\n  return (", "  const singleDeviceTypeLabel = jobDevices.length === 1 ? (singleDeviceIndoorUnits.length > 1 ? 'Multi-split' : 'Single-split') : '';\n\n  async function handleAddComment() {\n    if (!selectedJobId || commentSaving) return;\n    setCommentSaving(true);\n    try {\n      await addComment?.(selectedJobId, 'Komentarz');\n    } finally {\n      setCommentSaving(false);\n    }\n  }\n\n  return (")
          replace_exact(mobile_details, '<button className="btn premiumActionBtn commentAddBtn" onClick={() => addComment(selectedJob.id, "Komentarz")} disabled={!canSubmitComment}>Dodaj komentarz</button>', '<button className="btn premiumActionBtn commentAddBtn" onClick={() => void handleAddComment()} disabled={!canSubmitComment}>Dodaj komentarz</button>')

          protocol = 'src/mobile791/components/modals/ProtocolTestModal.jsx'
          replace_exact(protocol, '  const openedAtRef = useRef(new Date());\n  const [savedRecord, setSavedRecord] = useState(protocolRecord);', '  const openedAtRef = useRef(new Date());\n  const paymentDraftBaselineRef = useRef(JSON.stringify(getPaymentDraftFromJob(job)));\n  const [savedRecord, setSavedRecord] = useState(protocolRecord);')
          replace_exact(protocol, '    setSavedRecord(protocolRecord || null);\n    setEditing(!protocolRecord);\n    setPaymentDraft(getPaymentDraftFromJob(job));', '    setSavedRecord(protocolRecord || null);\n    setEditing(!protocolRecord);\n    const nextPaymentDraft = getPaymentDraftFromJob(job);\n    paymentDraftBaselineRef.current = JSON.stringify(nextPaymentDraft);\n    setPaymentDraft(nextPaymentDraft);')
          replace_exact(protocol, '      setSavedRecord(record);\n      setEditing(false);\n      setActionMenuOpen(false);', '      setSavedRecord(record);\n      setEditing(false);\n      paymentDraftBaselineRef.current = JSON.stringify(paymentDraft);\n      setHasSignature(false);\n      setSignatureDataUrl("");\n      setDraftHasSignature(false);\n      setActionMenuOpen(false);')
          replace_exact(protocol, '  const storedPayment = getPaymentDraftFromJob(job);', '  const paymentDraftDirty = JSON.stringify(paymentDraft) !== paymentDraftBaselineRef.current;\n  const protocolHasUnsavedWork = Boolean(open && (isGenerating || hasSignature || draftHasSignature || paymentDraftDirty));\n  const storedPayment = getPaymentDraftFromJob(job);')
          replace_exact(protocol, '      <AppModal\n        open={open}\n        onClose={isGenerating || signatureOpen ? undefined : onClose}', '      <AppModal\n        open={open}\n        warnBeforeUnload={protocolHasUnsavedWork}\n        onClose={isGenerating || signatureOpen ? undefined : onClose}')

          old_test = 'scripts/smoke-update-reload-guard-v1081.mjs'
          replace_exact(old_test, '  blockUpdateReload,\n  requestUpdateReload,', '  blockUpdateReload,\n  blockUnsavedWork,\n  requestUpdateReload,')
          replace_exact(old_test, "const releaseProtocol = blockUpdateReload('protocol');\nconst releaseNested = blockUpdateReload('signature');", "const releaseProtocol = blockUnsavedWork('protocol');\nconst releaseNested = blockUnsavedWork('signature');")

          test_groups = 'scripts/test-groups.cjs'
          replace_exact(test_groups, "    'node scripts/smoke-update-reload-guard-v1081.mjs',", "    'node scripts/smoke-update-reload-guard-v1081.mjs',\n    'node scripts/smoke-update-reload-guard-v1082.mjs',")

          smoke = r'''import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const scheduled = new Map();
          const listeners = new Map();
          let nextTimerId = 1;
          let reloadCount = 0;

          globalThis.CustomEvent = class CustomEvent {
            constructor(type, options = {}) {
              this.type = type;
              this.detail = options.detail;
            }
          };

          globalThis.window = {
            location: {
              reload() {
                reloadCount += 1;
              },
            },
            setTimeout(callback, delay) {
              const id = nextTimerId++;
              scheduled.set(id, { callback, delay });
              return id;
            },
            clearTimeout(id) {
              scheduled.delete(id);
            },
            addEventListener(type, handler) {
              listeners.set(type, handler);
            },
            removeEventListener(type, handler) {
              if (listeners.get(type) === handler) listeners.delete(type);
            },
            dispatchEvent() {
              return true;
            },
          };

          const guard = await import('../src/modules/update-reload-guard.js');
          const {
            blockBeforeUnload,
            blockUnsavedWork,
            blockUpdateReload,
            requestUpdateReload,
            getUpdateReloadGuardState,
            __resetUpdateReloadGuardForTests,
          } = guard;

          function flushOneScheduled() {
            const first = [...scheduled.entries()][0];
            assert.ok(first, 'Oczekiwano zaplanowanego timera reloadu.');
            scheduled.delete(first[0]);
            first[1].callback();
          }

          function reset() {
            __resetUpdateReloadGuardForTests();
            scheduled.clear();
            listeners.clear();
            reloadCount = 0;
          }

          reset();
          const releaseModal = blockUpdateReload('clean-modal');
          assert.equal(getUpdateReloadGuardState().blockers, 1);
          assert.equal(getUpdateReloadGuardState().beforeUnloadWarnings, 0, 'Czysty modal nie może powodować beforeunload.');
          assert.equal(listeners.has('beforeunload'), false, 'Czysty modal nie może ostrzegać o niezapisanej pracy.');
          releaseModal();

          const releaseWarning = blockBeforeUnload('dirty-only');
          assert.equal(getUpdateReloadGuardState().blockers, 0, 'Samo ostrzeżenie beforeunload nie może blokować update reloadu.');
          assert.equal(getUpdateReloadGuardState().beforeUnloadWarnings, 1);
          assert.ok(listeners.has('beforeunload'));
          releaseWarning();
          assert.equal(listeners.has('beforeunload'), false);

          const releaseDirty = blockUnsavedWork('dirty-form');
          assert.equal(getUpdateReloadGuardState().blockers, 1);
          assert.equal(getUpdateReloadGuardState().beforeUnloadWarnings, 1);
          releaseDirty();
          assert.equal(getUpdateReloadGuardState().blockers, 0);
          assert.equal(getUpdateReloadGuardState().beforeUnloadWarnings, 0);

          reset();
          assert.equal(requestUpdateReload('timer-recheck', { delayMs: 150 }), true);
          assert.equal(scheduled.size, 1);
          const releaseLate = blockUpdateReload('late-blocker');
          flushOneScheduled();
          assert.equal(reloadCount, 0, 'Timer musi ponownie sprawdzić blokery przed reloadem.');
          assert.equal(getUpdateReloadGuardState().pending, true, 'Reload ma pozostać oczekujący po pojawieniu się nowego blokera.');
          releaseLate();
          assert.equal(scheduled.size, 1, 'Po zwolnieniu późnego blokera reload ma zostać ponownie zaplanowany.');
          flushOneScheduled();
          assert.equal(reloadCount, 1);

          reset();
          const releaseFirst = blockUpdateReload('react-effect-first');
          assert.equal(requestUpdateReload('controllerchange'), false);
          releaseFirst();
          assert.equal(scheduled.size, 1, 'Cleanup starego efektu może zaplanować reload, ale nie może go wymusić.');
          const releaseReregistered = blockUpdateReload('react-effect-reregistered');
          flushOneScheduled();
          assert.equal(reloadCount, 0, 'Ponowna rejestracja blokera przed callbackiem musi zatrzymać reload.');
          assert.equal(getUpdateReloadGuardState().pending, true);
          releaseReregistered();
          flushOneScheduled();
          assert.equal(reloadCount, 1, 'Po prawdziwym zamknięciu pracy oczekujący reload ma wykonać się dokładnie raz.');

          const source = (file) => fs.readFileSync(path.join(root, file), 'utf8');
          const desktopModal = source('src/components/modals/AppModal.jsx');
          const mobileModal = source('src/mobile791/components/modals/AppModal.jsx');
          const fuel = source('src/components/fuel/FuelPanelBase.jsx');
          const desktopDetails = source('src/components/JobDetailsPanel.jsx');
          const mobileDetails = source('src/mobile791/components/JobDetailsPanel.jsx');
          const protocol = source('src/mobile791/components/modals/ProtocolTestModal.jsx');
          const desktopHook = source('src/hooks/useJobFormModal.js');
          const mobileHook = source('src/mobile791/hooks/useJobFormModal.js');
          const desktopForm = source('src/components/modals/JobFormModal.jsx');
          const mobileForm = source('src/mobile791/components/modals/JobFormModal.jsx');
          const desktopApp = source('src/App.jsx');
          const mobileApp = source('src/mobile791/App.jsx');

          for (const modal of [desktopModal, mobileModal]) {
            assert.match(modal, /warnBeforeUnload = false/);
            assert.match(modal, /return blockUpdateReload\(/);
            assert.match(modal, /\}, \[open\]\);/);
            assert.match(modal, /return blockBeforeUnload\(/);
          }
          assert.match(fuel, /blockUnsavedWork\('fuel-entry-draft'\)/);
          assert.match(fuel, /entrySaveInProgress/);
          assert.match(desktopDetails, /blockUnsavedWork\(`desktop-job-comment:/);
          assert.match(mobileDetails, /blockUnsavedWork\(`mobile-job-comment:/);
          assert.match(protocol, /warnBeforeUnload=\{protocolHasUnsavedWork\}/);
          assert.match(protocol, /setHasSignature\(false\);[\s\S]*setSignatureDataUrl\(""\);[\s\S]*setDraftHasSignature\(false\);/);
          for (const hook of [desktopHook, mobileHook]) assert.match(hook, /const jobFormDirty = getComparableJobForm/);
          for (const form of [desktopForm, mobileForm]) assert.match(form, /warnBeforeUnload=\{Boolean\(jobFormDirty \|\| busy\)\}/);
          for (const app of [desktopApp, mobileApp]) assert.match(app, /jobFormDirty=\{jobFormDirty\}/);

          console.log('PASS v10.82 F1/F2/F13: stable reload blockers, real dirty beforeunload, fuel/comment protection, timer recheck.');
          '''
          write('scripts/smoke-update-reload-guard-v1082.mjs', textwrap.dedent(smoke))

          e2e = r'''import { expect, test } from '@playwright/test';
          import { ADMIN, login, resetMockSupabase } from './mock-helpers.js';

          async function guardState(page) {
            return page.evaluate(async () => {
              const guard = await import('/src/modules/update-reload-guard.js');
              return guard.getUpdateReloadGuardState();
            });
          }

          test.describe('v10.82 update reload guard — real React integration', () => {
            test.use({ viewport: { width: 1440, height: 1000 } });

            test.beforeEach(async ({ page }) => {
              await resetMockSupabase(page);
            });

            test('timer ponownie sprawdza bloker, który pojawił się już po zaplanowaniu reloadu', async ({ page }) => {
              await page.goto('/');
              const result = await page.evaluate(async () => {
                const guard = await import('/src/modules/update-reload-guard.js');
                guard.__resetUpdateReloadGuardForTests();
                const scheduled = guard.requestUpdateReload('e2e-timer-recheck', { delayMs: 120 });
                await new Promise((resolve) => setTimeout(resolve, 25));
                guard.blockUpdateReload('e2e-late-blocker');
                await new Promise((resolve) => setTimeout(resolve, 150));
                const state = guard.getUpdateReloadGuardState();
                guard.__resetUpdateReloadGuardForTests();
                return { scheduled, state };
              });
              expect(result.scheduled).toBe(true);
              expect(result.state.blockers).toBe(1);
              expect(result.state.pending).toBe(true);
              expect(result.state.reloadScheduled).toBe(false);
            });

            test('rerender otwartego formularza nie zwalnia blokady, a beforeunload pojawia się dopiero po zmianie danych', async ({ page }) => {
              await login(page, ADMIN);
              await page.getByRole('button', { name: /^Montaże$/ }).click();
              await page.locator('button.desktopActionBtn.primary[title="Dodaj"]').click();
              const heading = page.getByRole('heading', { name: 'Nowy montaż / zlecenie' });
              await expect(heading).toBeVisible();

              let state = await guardState(page);
              expect(state.blockers).toBeGreaterThanOrEqual(1);
              expect(state.beforeUnloadWarnings).toBe(0);

              const deferred = await page.evaluate(async () => {
                const guard = await import('/src/modules/update-reload-guard.js');
                return guard.requestUpdateReload('e2e-react-rerender');
              });
              expect(deferred).toBe(false);

              await page.getByRole('textbox', { name: 'Klient', exact: true }).fill('Niezapisany draft 10.82');
              await page.waitForTimeout(100);
              await expect(heading).toBeVisible();
              state = await guardState(page);
              expect(state.blockers).toBeGreaterThanOrEqual(1);
              expect(state.pending).toBe(true);
              expect(state.beforeUnloadWarnings).toBeGreaterThanOrEqual(1);
            });

            test('paliwo i komentarz inline rejestrują ochronę dopiero po wpisaniu niezapisanych danych', async ({ page }) => {
              await login(page, ADMIN);
              await page.getByRole('button', { name: /Tankowania|Paliwo/ }).click();
              await page.getByRole('button', { name: /Rozwiń/ }).click();

              let state = await guardState(page);
              expect(state.blockers).toBe(0);
              expect(state.beforeUnloadWarnings).toBe(0);

              await page.getByPlaceholder('np. 48,5').fill('21,5');
              await page.waitForTimeout(25);
              state = await guardState(page);
              expect(state.blockers).toBeGreaterThanOrEqual(1);
              expect(state.beforeUnloadWarnings).toBeGreaterThanOrEqual(1);

              await page.getByPlaceholder('np. 48,5').fill('');
              await page.waitForTimeout(25);
              state = await guardState(page);
              expect(state.blockers).toBe(0);
              expect(state.beforeUnloadWarnings).toBe(0);

              await page.getByRole('button', { name: /^Montaże$/ }).click();
              await page.getByRole('button', { name: /W trakcie:/ }).click();
              await page.getByRole('table').getByText('Klient Testowy B', { exact: true }).click();
              const comment = page.getByPlaceholder('Napisz komentarz...');
              await expect(comment).toBeVisible();
              await comment.fill('Niezapisany komentarz 10.82');
              await page.waitForTimeout(25);
              state = await guardState(page);
              expect(state.blockers).toBeGreaterThanOrEqual(1);
              expect(state.beforeUnloadWarnings).toBeGreaterThanOrEqual(1);
            });
          });
          '''
          write('tests/e2e/update-reload-guard-v1082.spec.js', textwrap.dedent(e2e))
          PY

      - name: Bump version to 10.82
        shell: bash
        run: |
          node version-bump.cjs
          test "$(node -p "require('./app-version.json').version")" = "10.82"
          python3 <<'PY'
          from pathlib import Path
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '- wersja `10.82` — uzupełnij opis ostatniej poprawki po zakończeniu zmian.'
          new = '- wersja `10.82` — domknięcie audytu F1/F2/F13: stabilna ochrona przed reloadem, ochrona draftów paliwa i komentarzy oraz beforeunload tylko dla realnie niezapisanej pracy.'
          if old not in text:
              raise SystemExit('README: brak placeholdera 10.82')
          readme.write_text(text.replace(old, new, 1), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          old = '## 10.82\n- uzupełnij opis zmian dla wersji 10.82'
          new = '''## 10.82
          - F1: bloker otwartego modala jest stabilny między rerenderami Reacta, a callback reloadu ponownie sprawdza aktywne blokady przed przeładowaniem,
          - F2: formularz tankowania oraz komentarze desktop/mobile chronią realny draft i trwający zapis przed aktualizacją oraz zamknięciem karty,
          - F13: beforeunload jest oddzielony od samego faktu otwarcia modala i działa tylko przy dirty/saving state,
          - formularze montażu używają istniejącej detekcji zmian jako źródła warningu beforeunload, a czysty podgląd PDF nie ostrzega bez potrzeby,
          - protokół zachowuje ochronę podczas edycji/podpisu/zapisu i czyści stan dirty po udanym zapisie,
          - dodano regresję Node oraz rzeczywisty test Playwright obejmujący rerender formularza, późny bloker, paliwo i komentarz inline.'''
          import textwrap
          new = textwrap.dedent(new).rstrip()
          if old not in text:
              raise SystemExit('CHANGELOG: brak placeholdera 10.82')
          changelog.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
