name: Apply v10.80 changes

on:
  push:
    branches:
      - release/v10.80

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v10.80
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Patch 10.80
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Brak wzorca: {label}')
              return text.replace(old, new, 1)

          helper = """function normalizeSessionUserId(value) {
            return String(value || '').trim();
          }

          export function createSessionGenerationState(initialUserId = '') {
            return { generation: 0, userId: normalizeSessionUserId(initialUserId) };
          }

          export function transitionSessionGeneration(state, nextUserId = '') {
            if (!state || typeof state !== 'object') throw new Error('Brak stanu generacji sesji.');
            const normalizedUserId = normalizeSessionUserId(nextUserId);
            if (state.userId !== normalizedUserId) {
              state.generation = Math.max(0, Number(state.generation) || 0) + 1;
              state.userId = normalizedUserId;
            }
            return state.generation;
          }

          export function captureSessionGeneration(state, expectedUserId = state?.userId || '') {
            return {
              generation: Math.max(0, Number(state?.generation) || 0),
              userId: normalizeSessionUserId(expectedUserId),
            };
          }

          export function isSessionGenerationCurrent(state, token) {
            if (!state || !token) return false;
            return Math.max(0, Number(state.generation) || 0) === Math.max(0, Number(token.generation) || 0)
              && normalizeSessionUserId(state.userId) === normalizeSessionUserId(token.userId);
          }
          """
          Path('src/modules/session-generation.js').write_text(helper, encoding='utf-8')
          Path('src/mobile791/modules/session-generation.js').write_text(helper, encoding='utf-8')

          def patch_hook(path):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              s = replace_once(
                  s,
                  'import { loadMobileChangeBatch, loadMobileChangeHead } from "../modules/incremental-sync.js";\n',
                  'import { loadMobileChangeBatch, loadMobileChangeHead } from "../modules/incremental-sync.js";\nimport { captureSessionGeneration, createSessionGenerationState, isSessionGenerationCurrent, transitionSessionGeneration } from "../modules/session-generation.js";\n',
                  f'{path}: import session generation',
              )
              s = replace_once(
                  s,
                  '  const incrementalRefreshInFlightRef = useRef(null);\n',
                  '  const incrementalRefreshInFlightRef = useRef(null);\n  const sessionGenerationStateRef = useRef(createSessionGenerationState());\n',
                  f'{path}: session generation ref',
              )

              # Existing direct React state writes become generation-aware before helper insertion.
              s = re.sub(r'(?m)^(\s*)setSessionUser\(([^\n;]+)\);$', r'\1setSessionUserForGeneration(\2);', s)

              helper_block = """  const setSessionUserForGeneration = useCallback((nextUser) => {
            const nextUserId = String(nextUser?.id || '').trim();
            const previousUserId = String(sessionGenerationStateRef.current.userId || '').trim();
            transitionSessionGeneration(sessionGenerationStateRef.current, nextUserId);
            if (previousUserId !== nextUserId) {
              refreshPayloadInFlightRef.current.clear();
              incrementalRefreshInFlightRef.current = null;
              changeCursorRef.current = null;
              cacheHydratedUserIdRef.current = '';
              refreshRequestIdRef.current = 0;
              lastAppliedServerRequestIdRef.current = 0;
            }
            setSessionUser(nextUser || null);
          }, []);

          """
              s = replace_once(s, '  const applyLoggedOutState = useCallback(() => {\n', helper_block + '  const applyLoggedOutState = useCallback(() => {\n    setSessionUserForGeneration(null);\n', f'{path}: safe session setter')
              s = s.replace('      setSessionUser,\n', '      setSessionUser: setSessionUserForGeneration,\n')
              s = s.replace('  }, [setSelectedJob]);\n\n  const refreshAll', '  }, [setSelectedJob, setSessionUserForGeneration]);\n\n  const refreshAll', 1)

              refresh_start = """    const userId = String(user.id || '').trim();
              const sessionToken = captureSessionGeneration(sessionGenerationStateRef.current, userId);
              const isCurrentSession = () => isSessionGenerationCurrent(sessionGenerationStateRef.current, sessionToken);
              if (!isCurrentSession()) return { ok: false, ignoredStaleSession: true };
          """
              s = replace_once(s, "    const userId = String(user.id || '').trim();\n", refresh_start, f'{path}: refresh token')
              s = s.replace("        const requestKey = `${activeUserId}:${preserveJobDetails ? 'preserve' : 'replace'}`;", "        const requestKey = `${sessionToken.generation}:${activeUserId}:${preserveJobDetails ? 'preserve' : 'replace'}`;", 1)

              # Cache reads must not apply after account transition.
              s = s.replace('        const cached = await loadOfflineAppSnapshot(userId);\n', '        const cached = await loadOfflineAppSnapshot(userId);\n        if (!isCurrentSession()) return { ok: false, ignoredStaleSession: true };\n', 1)
              s = s.replace('        const cached = await loadAppDataSnapshot(userId);\n', '        const cached = await loadAppDataSnapshot(userId);\n        if (!isCurrentSession()) return { ok: false, ignoredStaleSession: true };\n', 1)
              s = s.replace('          const operations = await listOfflineJobOperations(userId);\n', '          const operations = await listOfflineJobOperations(userId);\n          if (!isCurrentSession()) return { ok: false, ignoredStaleSession: true };\n', 1)
              s = s.replace('      changeCursorAtRefreshStart = await loadMobileChangeHead({ supabase }).catch(() => null);\n', '      changeCursorAtRefreshStart = await loadMobileChangeHead({ supabase }).catch(() => null);\n      if (!isCurrentSession()) return { ok: false, ignoredStaleSession: true };\n', 1)
              s = s.replace('        if (!Array.isArray(freshJobs)) return;\n', '        if (!Array.isArray(freshJobs) || !isCurrentSession()) return;\n', 1)
              s = s.replace("        const operations = await listOfflineJobOperations(String(activeUser?.id || userId));\n", "        const operations = await listOfflineJobOperations(String(activeUser?.id || userId));\n        if (!isCurrentSession()) return;\n", 1)
              s = s.replace('        setSessionUserForGeneration(refreshedUser);\n        payload = await loadServerPayloadOnce(refreshedUser);', '        setSessionUserForGeneration(refreshedUser);\n        if (!isCurrentSession()) return { ok: false, ignoredStaleSession: true };\n        payload = await loadServerPayloadOnce(refreshedUser);', 1)
              s = s.replace('      if (refreshRequestId < lastAppliedServerRequestIdRef.current) {', '      if (!isCurrentSession()) return { ok: false, ignoredStaleSession: true, coreJobsApplied };\n      if (refreshRequestId < lastAppliedServerRequestIdRef.current) {', 1)
              s = s.replace("    } catch (error) {\n      console.error('refreshAll failed', error);", "    } catch (error) {\n      if (!isCurrentSession()) return { ok: false, ignoredStaleSession: true, coreJobsApplied };\n      console.error('refreshAll failed', error);", 1)
              s = s.replace('    } finally {\n      if (!silent) {', '    } finally {\n      if (!silent && isCurrentSession()) {', 1)
              s = s.replace('  }, [normalizeStatus, selectedJobIdRef, setSelectedJob, supabase]);', '  }, [normalizeStatus, selectedJobIdRef, setSelectedJob, setSessionUserForGeneration, supabase]);', 1)

              # Incremental refresh gets the same account-generation token.
              old_changed = """  const refreshChanged = useCallback(async (user, options = {}) => {
            if (!supabase || !user) return { ok: false, unavailable: true };
            if (incrementalRefreshInFlightRef.current) return incrementalRefreshInFlightRef.current;

            const request = (async () => {
              const userId = String(user.id || '').trim();
          """
              new_changed = """  const refreshChanged = useCallback(async (user, options = {}) => {
            if (!supabase || !user) return { ok: false, unavailable: true };
            const userId = String(user.id || '').trim();
            const sessionToken = captureSessionGeneration(sessionGenerationStateRef.current, userId);
            const isCurrentSession = () => isSessionGenerationCurrent(sessionGenerationStateRef.current, sessionToken);
            if (!isCurrentSession()) return { ok: false, ignoredStaleSession: true };
            if (incrementalRefreshInFlightRef.current) return incrementalRefreshInFlightRef.current;

            const request = (async () => {
          """
              s = replace_once(s, old_changed, new_changed, f'{path}: incremental token')
              changed_idx = s.index('  const refreshChanged = useCallback')
              prefix, tail = s[:changed_idx], s[changed_idx:]
              tail = tail.replace('        const operations = await listOfflineJobOperations(userId);\n', '        const operations = await listOfflineJobOperations(userId);\n        if (!isCurrentSession()) return { ok: false, ignoredStaleSession: true };\n', 1)
              tail = tail.replace('          const batch = await loadMobileChangeBatch({ supabase, afterCursor: cursor, limit: 100 });\n', '          const batch = await loadMobileChangeBatch({ supabase, afterCursor: cursor, limit: 100 });\n          if (!isCurrentSession()) return { ok: false, ignoredStaleSession: true };\n', 1)
              tail = tail.replace('              summary = await loadJobSummaryData({ supabase, jobId: change.jobId });\n', '              summary = await loadJobSummaryData({ supabase, jobId: change.jobId });\n              if (!isCurrentSession()) return { ok: false, ignoredStaleSession: true };\n', 1)
              tail = tail.replace('            cursor = nextCursor;\n', '            if (!isCurrentSession()) return { ok: false, ignoredStaleSession: true };\n            cursor = nextCursor;\n', 1)
              tail = tail.replace('        if (processed > 0) {\n', '        if (!isCurrentSession()) return { ok: false, ignoredStaleSession: true };\n        if (processed > 0) {\n', 1)
              # Desktop save block has the same cursor assignment; the replacement above covers it.
              tail = tail.replace("      } catch (error) {\n        console.warn('Przyrostowe odświeżanie", "      } catch (error) {\n        if (!isCurrentSession()) return { ok: false, ignoredStaleSession: true };\n        console.warn('Przyrostowe odświeżanie", 1)
              s = prefix + tail

              # All Auth entry points update generation before any refresh can apply data.
              s = s.replace('      setSessionUser,\n', '      setSessionUser: setSessionUserForGeneration,\n')
              s = s.replace('          setSessionUser,\n', '          setSessionUser: setSessionUserForGeneration,\n')
              s = s.replace('      setSessionUser,\n', '      setSessionUser: setSessionUserForGeneration,\n')
              s = s.replace('  }, [applyLoggedOutState, logoutFlagKey, refreshAll, supabase]);', '  }, [applyLoggedOutState, logoutFlagKey, refreshAll, setSessionUserForGeneration, supabase]);', 1)

              p.write_text(s, encoding='utf-8')

          patch_hook('src/hooks/useAppSession.js')
          patch_hook('src/mobile791/hooks/useAppSession.js')

          # Full request timeout, including body consumption after headers arrive.
          request_timeout = """export const MOBILE_SUPABASE_REQUEST_TIMEOUT_MS = 45 * 1000;
          export const MOBILE_SUPABASE_STORAGE_TIMEOUT_MS = 90 * 1000;

          function normalizeRequestUrl(input) {
            if (typeof input === 'string') return input;
            if (input && typeof input.url === 'string') return input.url;
            return String(input || '');
          }

          function normalizeRequestMethod(input, init = {}) {
            return String(init?.method || input?.method || 'GET').trim().toUpperCase();
          }

          export function resolveSupabaseRequestTimeoutMs(input) {
            const url = normalizeRequestUrl(input);
            return /\\/storage\\/v1\\/object\\//i.test(url)
              ? MOBILE_SUPABASE_STORAGE_TIMEOUT_MS
              : MOBILE_SUPABASE_REQUEST_TIMEOUT_MS;
          }

          export function createSupabaseRequestTimeoutError(timeoutMs) {
            const error = new Error(`Supabase request timeout after ${Math.max(1, Number(timeoutMs) || 0)} ms.`);
            error.name = 'AbortError';
            error.code = 'SUPABASE_REQUEST_TIMEOUT';
            error.timeout_ms = Math.max(1, Number(timeoutMs) || 0);
            error.transient = true;
            return error;
          }

          function responseHasNoBody(response, method) {
            return method === 'HEAD' || response?.status === 204 || response?.status === 205 || response?.body == null;
          }

          function wrapTimedResponse(response, { getTimeoutError, cleanup }) {
            const bodyMethods = new Set(['arrayBuffer', 'blob', 'formData', 'json', 'text']);
            return new Proxy(response, {
              get(target, property) {
                if (bodyMethods.has(property) && typeof target[property] === 'function') {
                  return async (...args) => {
                    const existingTimeout = getTimeoutError();
                    if (existingTimeout) {
                      cleanup();
                      throw existingTimeout;
                    }
                    try {
                      return await target[property](...args);
                    } catch (error) {
                      const timeoutError = getTimeoutError();
                      if (timeoutError) throw timeoutError;
                      throw error;
                    } finally {
                      cleanup();
                    }
                  };
                }
                const value = Reflect.get(target, property, target);
                return typeof value === 'function' ? value.bind(target) : value;
              },
            });
          }

          export async function fetchWithTimeout(input, init = {}, options = {}) {
            const fetchImpl = options.fetchImpl || globalThis.fetch?.bind(globalThis);
            if (typeof fetchImpl !== 'function') throw new Error('Brak implementacji fetch dla Supabase.');

            const resolvedTimeout = Math.max(
              1,
              Number(options.timeoutMs || resolveSupabaseRequestTimeoutMs(input)) || MOBILE_SUPABASE_REQUEST_TIMEOUT_MS,
            );
            if (typeof AbortController === 'undefined') return fetchImpl(input, init);

            const controller = new AbortController();
            const externalSignal = init?.signal || null;
            let timeoutError = null;
            let detachExternalAbort = null;
            let timeoutId = null;
            let cleaned = false;

            const cleanup = () => {
              if (cleaned) return;
              cleaned = true;
              if (timeoutId) clearTimeout(timeoutId);
              detachExternalAbort?.();
            };

            if (externalSignal) {
              const abortFromExternalSignal = () => {
                try {
                  controller.abort(externalSignal.reason);
                } catch {
                  controller.abort();
                }
              };
              if (externalSignal.aborted) abortFromExternalSignal();
              else if (typeof externalSignal.addEventListener === 'function') {
                externalSignal.addEventListener('abort', abortFromExternalSignal, { once: true });
                detachExternalAbort = () => externalSignal.removeEventListener?.('abort', abortFromExternalSignal);
              }
            }

            timeoutId = setTimeout(() => {
              timeoutError = createSupabaseRequestTimeoutError(resolvedTimeout);
              try {
                controller.abort(timeoutError);
              } catch {
                controller.abort();
              }
            }, resolvedTimeout);

            let response;
            try {
              response = await fetchImpl(input, { ...init, signal: controller.signal });
            } catch (error) {
              cleanup();
              if (timeoutError) throw timeoutError;
              throw error;
            }

            if (timeoutError) {
              cleanup();
              throw timeoutError;
            }
            if (responseHasNoBody(response, normalizeRequestMethod(input, init))) {
              cleanup();
              return response;
            }

            return wrapTimedResponse(response, { getTimeoutError: () => timeoutError, cleanup });
          }

          export function createTimedSupabaseFetch(options = {}) {
            return (input, init = {}) => fetchWithTimeout(input, init, options);
          }
          """
          Path('src/mobile791/modules/request-timeout.js').write_text(request_timeout.replace('          ', ''), encoding='utf-8')

          # A late status/error update must never resurrect an operation already superseded/deleted.
          p = Path('src/mobile791/modules/job-offline-store.js')
          s = p.read_text(encoding='utf-8')
          old = """export async function updateOfflineJobOperation(operationId, patch = {}) {
            if (!operationId) return false;
            try {
              const current = await withStore(OPERATION_STORE, 'readonly', (store) => store.get(String(operationId)));
              if (!current) return false;
              await withStore(OPERATION_STORE, 'readwrite', (store) => store.put({ ...current, ...patch, id: String(operationId) }));
              dispatchOfflineChanged();
              return true;
            } catch (error) {
              console.warn('Nie udało się zaktualizować zmiany offline.', error?.message || error);
              return false;
            }
          }
          """.replace('            ', '')
          new = """export async function updateOfflineJobOperation(operationId, patch = {}) {
            if (!operationId) return false;
            let db;
            try {
              db = await openOfflineDb();
              if (!db) return false;
              const updated = await new Promise((resolve, reject) => {
                const transaction = db.transaction(OPERATION_STORE, 'readwrite');
                const store = transaction.objectStore(OPERATION_STORE);
                const request = store.get(String(operationId));
                let changed = false;

                request.onsuccess = () => {
                  const current = request.result;
                  if (!current) return;
                  changed = true;
                  store.put({ ...current, ...patch, id: String(operationId) });
                };
                request.onerror = () => reject(request.error || new Error('Nie udało się odczytać zmiany offline do aktualizacji.'));
                transaction.oncomplete = () => resolve(changed);
                transaction.onerror = () => reject(transaction.error || new Error('Nie udało się atomowo zaktualizować zmiany offline.'));
                transaction.onabort = transaction.onerror;
              });
              if (updated) dispatchOfflineChanged();
              return updated;
            } catch (error) {
              console.warn('Nie udało się zaktualizować zmiany offline.', error?.message || error);
              return false;
            } finally {
              db?.close();
            }
          }
          """.replace('            ', '')
          if old not in s:
              raise SystemExit('Brak starej implementacji updateOfflineJobOperation')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Behavioral smoke: session generation + body timeout; integration assertions for both hooks and IDB update shape.
          smoke = r"""import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createSessionGenerationState, transitionSessionGeneration, captureSessionGeneration, isSessionGenerationCurrent } from '../src/mobile791/modules/session-generation.js';
          import { fetchWithTimeout } from '../src/mobile791/modules/request-timeout.js';

          const state = createSessionGenerationState();
          transitionSessionGeneration(state, 'user-a');
          const tokenA = captureSessionGeneration(state, 'user-a');
          let applied = 'none';
          const lateA = new Promise((resolve) => setTimeout(() => resolve('A'), 35));
          transitionSessionGeneration(state, 'user-b');
          const tokenB = captureSessionGeneration(state, 'user-b');
          const valueA = await lateA;
          if (isSessionGenerationCurrent(state, tokenA)) applied = valueA;
          if (isSessionGenerationCurrent(state, tokenB)) applied = 'B';
          assert.equal(applied, 'B', 'Późna odpowiedź konta A nie może zastosować stanu po przejściu na B.');
          assert.equal(isSessionGenerationCurrent(state, tokenA), false);
          assert.equal(isSessionGenerationCurrent(state, tokenB), true);

          const bodyHungFetch = async (_input, init = {}) => {
            const stream = new ReadableStream({
              start(controller) {
                controller.enqueue(new TextEncoder().encode('{"partial":'));
                init.signal?.addEventListener?.('abort', () => {
                  controller.error(init.signal?.reason || Object.assign(new Error('aborted'), { name: 'AbortError' }));
                }, { once: true });
              },
            });
            return new Response(stream, { status: 200, headers: { 'content-type': 'application/json' } });
          };
          const response = await fetchWithTimeout('https://example.test/rest/v1/jobs', {}, { timeoutMs: 30, fetchImpl: bodyHungFetch });
          let bodyTimeout = null;
          try { await response.text(); } catch (error) { bodyTimeout = error; }
          assert(bodyTimeout, 'Timeout musi obejmować także zawieszone body po otrzymaniu nagłówków.');
          assert.equal(bodyTimeout.code, 'SUPABASE_REQUEST_TIMEOUT');
          assert.equal(bodyTimeout.name, 'AbortError');

          const fast = await fetchWithTimeout('https://example.test/rest/v1/jobs', {}, {
            timeoutMs: 100,
            fetchImpl: async () => new Response('{"ok":true}', { headers: { 'content-type': 'application/json' } }),
          });
          assert.deepEqual(await fast.json(), { ok: true });

          for (const path of ['src/hooks/useAppSession.js', 'src/mobile791/hooks/useAppSession.js']) {
            const source = fs.readFileSync(path, 'utf8');
            assert.match(source, /createSessionGenerationState/);
            assert.match(source, /captureSessionGeneration/);
            assert.match(source, /isCurrentSession/);
            assert.match(source, /setSessionUserForGeneration/);
            assert.match(source, /ignoredStaleSession/);
            assert.match(source, /sessionToken\.generation/);
          }

          const storeSource = fs.readFileSync('src/mobile791/modules/job-offline-store.js', 'utf8');
          const updateSource = storeSource.match(/export async function updateOfflineJobOperation[\s\S]*?export async function deleteOfflineJobOperation/)?.[0] || '';
          assert.match(updateSource, /db\.transaction\(OPERATION_STORE, 'readwrite'\)/);
          assert.match(updateSource, /const request = store\.get/);
          assert.match(updateSource, /store\.put/);
          assert.doesNotMatch(updateSource, /withStore\(OPERATION_STORE, 'readonly'/);

          console.log('OK: 10.80 — generation guard, timeout całego response body i atomowa aktualizacja kolejki.');
          """.replace('          ', '')
          Path('scripts/smoke-session-sync-resilience-v1080.mjs').write_text(smoke, encoding='utf-8')

          # Extend the real Chromium IndexedDB regression with the stale-update race.
          e2e = Path('tests/e2e/mobile-offline-atomic-v1075.spec.js')
          e2e_source = e2e.read_text(encoding='utf-8')
          if 'v10.80 — spóźniona aktualizacja nie wskrzesza' not in e2e_source:
              e2e_source += r"""

          test('@mobile v10.80 — spóźniona aktualizacja nie wskrzesza zastąpionej operacji', async ({ page }) => {
            await page.goto('/');
            const result = await page.evaluate(async () => {
              await new Promise((resolve) => {
                const request = indexedDB.deleteDatabase('wawis-mobile-offline-data');
                request.onsuccess = () => resolve(true);
                request.onerror = () => resolve(false);
                request.onblocked = () => resolve(false);
              });
              const store = await import('/src/mobile791/modules/job-offline-store.js');
              await store.queueOfflineJobOperation({
                id: 'status-race-old', user_id: 'worker-race', job_id: 'job-race', type: 'status',
                base: { status: 'Nowe' }, payload: { status: 'W trakcie' }, created_at: '2026-09-16T08:00:00.000Z',
              });

              const originalTransaction = IDBDatabase.prototype.transaction;
              let delayedReadonly = false;
              IDBDatabase.prototype.transaction = function patchedTransaction(storeNames, mode, ...args) {
                const tx = originalTransaction.call(this, storeNames, mode, ...args);
                if (!delayedReadonly && mode === 'readonly' && String(storeNames).includes('job-operations')) {
                  delayedReadonly = true;
                  let assigned = null;
                  Object.defineProperty(tx, 'oncomplete', {
                    configurable: true,
                    get: () => assigned,
                    set: (handler) => {
                      assigned = handler;
                      tx.addEventListener('complete', (event) => setTimeout(() => handler?.call(tx, event), 60), { once: true });
                    },
                  });
                }
                return tx;
              };

              try {
                const lateUpdate = store.updateOfflineJobOperation('status-race-old', { error: 'late-old-update' });
                await new Promise((resolve) => setTimeout(resolve, 15));
                const replacement = store.queueOfflineJobOperation({
                  id: 'status-race-new', user_id: 'worker-race', job_id: 'job-race', type: 'status',
                  base: { status: 'W trakcie' }, payload: { status: 'Zakończone' }, created_at: '2026-09-16T08:01:00.000Z',
                });
                await Promise.all([lateUpdate, replacement]);
              } finally {
                IDBDatabase.prototype.transaction = originalTransaction;
              }

              const rows = await store.listOfflineJobOperations('worker-race');
              return rows.map((row) => ({ id: row.id, payload: row.payload, error: row.error }));
            });

            expect(result).toHaveLength(1);
            expect(result[0].id).toBe('status-race-new');
            expect(result[0].payload.status).toBe('Zakończone');
          });
          """.replace('          ', '')
              e2e.write_text(e2e_source, encoding='utf-8')

          # Make the new behavioral smoke part of the normal core PR group.
          tg = Path('scripts/test-groups.cjs')
          tgs = tg.read_text(encoding='utf-8')
          anchor = "    'node scripts/smoke-mobile-offline-resilience-v1075.mjs',\n"
          if "smoke-session-sync-resilience-v1080.mjs" not in tgs:
              if anchor not in tgs: raise SystemExit('Brak miejsca w core test group')
              tgs = tgs.replace(anchor, anchor + "    'node scripts/smoke-session-sync-resilience-v1080.mjs',\n", 1)
          tg.write_text(tgs, encoding='utf-8')

          # Release metadata.
          gate_path = Path('RELEASE-GATE.json')
          gate = json.loads(gate_path.read_text(encoding='utf-8'))
          gate['version'] = '10.80'
          gate['scope'] = 'full'
          gate['release_branch'] = 'release/v10.80'
          gate['baseline_diagnostics'] = {
            'checked': True, 'last_24h': True, 'checked_at': '2026-09-16T10:45:00+02:00', 'result': 'INFO',
            'notes': '10.80: session generation + pełny body timeout + atomowa aktualizacja kolejki; diagnostyka informacyjna.'
          }
          gate['main_protection'] = {
            'source_branch': 'release/v10.80', 'ready_for_main': True,
            'required_check': 'WAWIS PR checks / targeted-checks'
          }
          gate_path.write_text(json.dumps(gate, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('release-notes.json').write_text(json.dumps({
            'version': '10.80',
            'summary': 'Ochrona sesji A→B i domknięcie odporności synchronizacji.',
            'changes': [
              'Generacja sesji blokuje spóźnione odpowiedzi starego konta na mobile i desktop.',
              'Timeout Supabase obejmuje również odczyt body po otrzymaniu nagłówków.',
              'Aktualizacja wpisu kolejki offline odbywa się w jednej transakcji readwrite i nie może wskrzesić zastąpionej operacji.',
              'Dodano test zachowania A→B, zawieszonego body oraz prawdziwy test IndexedDB w Chromium.'
            ]
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('RELEASE-RESULT.md').write_text("""# RELEASE RESULT

          ## Wersja
          - 10.80

          ## Proces
          - jedna obowiązkowa bramka: `WAWIS PR checks / targeted-checks`
          - po zielonym PR: merge do `main` i jeden produkcyjny Vercel
          - Google Drive / ZIP / osobny final runner / blokujący post-deploy: niewymagane

          ## Zakres
          - session generation mobile + desktop
          - timeout obejmujący body odpowiedzi Supabase mobile
          - atomowa aktualizacja operacji IndexedDB mobile
          """.replace('          ', ''), encoding='utf-8')
          PY

      - name: Bump version to 10.80
        run: |
          node version-bump.cjs
          python3 <<'PY'
          from pathlib import Path
          r = Path('README.md')
          s = r.read_text(encoding='utf-8')
          s = s.replace('- wersja `10.80` — uzupełnij opis ostatniej poprawki po zakończeniu zmian.', '- wersja `10.80` — ochrona sesji A→B, pełny timeout odpowiedzi i bezpieczna kolejka offline.')
          r.write_text(s, encoding='utf-8')
          c = Path('CHANGELOG.md')
          s = c.read_text(encoding='utf-8')
          s = s.replace('## 10.80\n- uzupełnij opis zmian dla wersji 10.80', """## 10.80
          - Dodano generację sesji na mobile i desktop: odpowiedzi wystartowane dla konta A są ignorowane po logout/przejściu na konto B.
          - Timeout mobilnego klienta Supabase obejmuje teraz również odczyt body po otrzymaniu nagłówków HTTP.
          - `updateOfflineJobOperation` używa jednej transakcji IndexedDB `readwrite`, więc spóźniona aktualizacja nie może wskrzesić zastąpionej operacji.
          - Dodano behawioralne regresje A→B i body-timeout oraz test Chromium dla wyścigu IndexedDB.""".replace('          ', ''))
          c.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Focused Node regressions
        run: |
          node scripts/smoke-session-sync-resilience-v1080.mjs
          node scripts/smoke-mobile-offline-resilience-v1075.mjs
          node scripts/smoke-auth-refresh.cjs
          node scripts/smoke-version-ui.cjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Real IndexedDB race regression
        run: npx playwright test tests/e2e/mobile-offline-atomic-v1075.spec.js --project=chromium

      - name: Commit release candidate and remove bootstrap
        shell: bash
        run: |
          rm -f .github/workflows/apply-v1080.yml
          git config user.name "wawis-klima"
          git config user.email "wasik@wawis.pl"
          git add -A
          git commit -m "release: prepare 10.80 session and sync resilience"
          git push origin HEAD:release/v10.80
