name: WAWIS diag — mobile E2E (dev server) z adnotacjami

# TYMCZASOWY (13.76): zestaw @mobile jak w targeted-checks, ale z raportem JSON i adnotacjami błędów
# (logi CI są niedostępne poza GitHubem). Tylko odczyt repozytorium, bez sekretów, bez wdrożenia. Usunąć przed scaleniem.
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/diag-mobile-e2e.yml']

permissions:
  contents: read

jobs:
  diag-mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=optional --registry=https://registry.npmjs.org/
      - timeout-minutes: 6
        run: npx playwright install chromium --only-shell
      - name: Mobile E2E (jak targeted-checks)
        env:
          VITE_SUPABASE_MODE: mock
          PLAYWRIGHT_JSON_OUTPUT_NAME: diag-mobile.json
        run: node scripts/run-playwright-mobile.cjs --reporter=json tests/e2e/mobile-resilience.spec.js --repeat-each=8 || true
      - name: Adnotacje
        if: always()
        run: |
          node -e '
          const r=require("./diag-mobile.json");const out=[];
          const walk=(s)=>{for(const sp of s.specs||[])for(const t of sp.tests||[]){const l=(t.results||[]).slice(-1)[0]||{};if(l.status!=="passed"){const e=[l.error?.message,...(l.errors||[]).map(x=>x?.message)].filter(Boolean).join(" || ").replace(/\u001b\[[0-9;]*m/g,"").replace(/\s+/g," ").slice(0,900);out.push(`${sp.file} › ${sp.title} [${l.status||t.status}] ${e}`)}};for(const c of s.suites||[])walk(c)};
          for(const s of r.suites||[])walk(s);
          for(const line of out)console.log(`::error title=Diag::${line.replace(/%/g,"%25")}`);
          console.log(`::notice title=Diag::niezaliczone=${out.length}`);'
