name: WAWIS 10.78 final race fix

on:
  push:
    branches:
      - release/v10.78

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v10.78
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply stale delivery race fix
        run: python scripts/apply-v1078-expiry-race-fix.py
      - name: Run PUSH regressions
        run: |
          node scripts/smoke-push-safety-v1078.mjs
          npm run test:smoke:push-logout-handoff
          node scripts/release-policy-gate.cjs
      - name: Commit source and test
        run: |
          git config user.name "wawis-klima"
          git config user.email "wasik@wawis.pl"
          git add supabase/functions/send-assignment-push/index.ts scripts/smoke-push-safety-v1078.mjs
          git commit -m "fix: guard expired push cleanup by owner generation"
          git push origin HEAD:release/v10.78
