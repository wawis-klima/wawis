name: Finalize WAWIS 10.61 metadata

on:
  push:
    branches:
      - release/v10.61
    paths:
      - '.github/workflows/finalize-v1061-metadata.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v10.61
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update README and CHANGELOG
        run: node scripts/update-release-docs.cjs

      - name: Add release helper npm scripts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.scripts = pkg.scripts || {};
          pkg.scripts['test:group'] = 'node scripts/run-test-group.cjs';
          pkg.scripts['test:pr'] = 'node scripts/run-pr-checks.cjs';
          pkg.scripts['test:smoke:release-automation'] = 'node scripts/smoke-release-automation-v1061.cjs';
          pkg.scripts['postdeploy:check'] = 'node scripts/post-deploy-check.mjs';
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Commit generated metadata
        shell: bash
        run: |
          git config user.name "wawis-klima"
          git config user.email "wasik@wawis.pl"
          git add README.md CHANGELOG.md package.json
          if git diff --cached --quiet; then
            echo "No metadata changes to commit"
            exit 0
          fi
          git commit -m "Finalize WAWIS 10.61 release metadata"
          git push origin HEAD:release/v10.61
