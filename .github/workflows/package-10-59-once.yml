name: One-time WAWIS 10.59 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-10-59-once.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore single full-size protocol share
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/mobile791/modules/job-protocol-storage.js')
          s = p.read_text()
          s = s.replace('const PRINT_COPY_COUNT = 2;\nconst pendingProtocolPrintCopies = new Map();\n', '', 1)
          old_name = '''function getPrintImageFileName(pdfFileName, copyNumber = null) {\n  const baseName = (normalizeText(pdfFileName) || "wawis-protokol.pdf").replace(/\\.pdf$/i, "");\n  if (copyNumber) return `${baseName}-druk-egzemplarz-${copyNumber}.png`;\n  return `${baseName}-druk.png`;\n}\n'''
          new_name = '''function getPrintImageFileName(pdfFileName) {\n  const baseName = (normalizeText(pdfFileName) || "wawis-protokol.pdf").replace(/\\.pdf$/i, "");\n  return `${baseName}-druk.png`;\n}\n'''
          if old_name not in s:
              raise SystemExit('getPrintImageFileName block not found')
          s = s.replace(old_name, new_name, 1)
          start = s.index('function createSeparatePrintCopy(file, pdfFileName, copyNumber) {')
          end = s.index('\nexport async function printStoredJobProtocol', start)
          new_block = r'''export async function shareStoredJobProtocol({
            supabase,
            record,
            intent = "print",
            createPrintImage = createProtocolPrintImage,
          }) {
            if (intent !== "print") throw new Error("Wysyłkę e-mail realizuje zabezpieczony serwer WAWIS.");
            const pdfBlob = await downloadProtocolBlob({ supabase, record });
            const file = await createPrintImage(pdfBlob, record.file_name);

            if (file && typeof navigator !== "undefined" && navigator.share && navigator.canShare?.({ files: [file] })) {
              // Phomemo M832 dostaje dokładnie jeden pełnowymiarowy obraz protokołu.
              // Kolejne egzemplarze trzeba uruchomić w Phomemo ręcznie, ponieważ ten model
              // nie obsługuje niezawodnie automatycznych dwóch kolejnych zadań z iOS.
              await navigator.share({ files: [file] });
              return { method: "share-image", copies: 1, fullSize: true };
            }

            throw new Error("Ten telefon nie pozwala przekazać obrazu protokołu bezpośrednio do aplikacji Phomemo.");
          }
          '''
          s = s[:start] + new_block + s[end:]
          p.write_text(s)
          PY

      - name: Verify protocol print module syntax
        run: node --check src/mobile791/modules/job-protocol-storage.js

      - name: Set official next version from 10.58 to 10.59
        run: node version-bump.cjs

      - name: Commit official 10.59 release
        run: |
          git config user.name "wawis-klima"
          git config user.email "wasik@wawis.pl"
          git add src/mobile791/modules/job-protocol-storage.js app-version.json package.json package-lock.json src/version.js src/mobile791/version.js README.md CHANGELOG.md
          git commit -m "WAWIS 10.59: przywróć pojedynczy pełnowymiarowy druk protokołu"
          git push origin HEAD:main

      - name: Build release ZIP
        run: node scripts/release-zip.cjs

      - name: Upload WAWIS 10.59 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: klima-app-v10.59
          path: releases/klima-app-v10.59.zip
          if-no-files-found: error
          retention-days: 7
