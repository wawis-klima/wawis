name: Build Wawis 10.52 archive

on:
  push:
    branches:
      - build-archive-v10.52

jobs:
  build-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release ZIP
        run: npm run zip:release

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: klima-app-v10.52
          path: releases/klima-app-v10.52.zip
          if-no-files-found: error
          retention-days: 30
