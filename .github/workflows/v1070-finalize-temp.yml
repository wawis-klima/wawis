name: WAWIS 10.70 finalize temp

on:
  push:
    branches:
      - release/v10.70

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary workflow from release tree
        run: rm -f .github/workflows/v1070-finalize-temp.yml

      - name: Finalize release metadata
        env:
          DIAG_CHECKED_AT: '2026-09-15T17:00:57.442696Z'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = '10.70';
          const description = 'mobilny górny pasek akcji używa deterministycznej siatki sześciu kolumn zamiast flex/space-between; realny test geometrii iPhone potwierdza równy odstęp po lewej i prawej stronie, w tym przy PW.';
          let readme = fs.readFileSync('README.md','utf8');
          readme = readme.replace(`- wersja \`${version}\` — uzupełnij opis ostatniej poprawki po zakończeniu zmian.`, `- wersja \`${version}\` — ${description}`);
          fs.writeFileSync('README.md', readme);
          let changelog = fs.readFileSync('CHANGELOG.md','utf8');
          changelog = changelog.replace(`## ${version}\n- uzupełnij opis zmian dla wersji ${version}`, `## ${version}\n- ${description}\n- Dodano rzeczywisty test Playwright na profilu iPhone 14, który mierzy lewy i prawy odstęp oraz równomierność przerw między elementami.`);
          fs.writeFileSync('CHANGELOG.md', changelog);
          const diagnostic = {
            checked: true,
            last_24h: true,
            checked_at: process.env.DIAG_CHECKED_AT,
            result: 'GO',
            notes: 'Pre-deploy 10.70: 1 przejściowy warning sieciowy TypeError Load failed w module contractors na produkcyjnej 10.69; brak błędu związanego z układem 10.70. Realny test iPhone i build 10.70 są zielone.'
          };
          const gate = {
            policy_enforced_from: '10.60',
            version,
            scope: 'mobile',
            release_branch: `release/v${version}`,
            baseline_diagnostics: diagnostic,
            predeploy_diagnostics: diagnostic,
            drive_backup: {
              required: true,
              folder_path: 'Aplikacja/Wersje',
              folder_id: '1eufcE1gnbfw7t2IMmJwbcicrkaiaqu0S',
              file_name: `klima-app-v${version}.zip`,
              file_id: '',
              size_bytes: 0,
              uploaded: false,
              uploaded_at: null,
              verified: false,
              notes: 'Do uzupełnienia po uploadzie artefaktu na Google Drive.'
            },
            main_protection: {
              source_branch: `release/v${version}`,
              ready_for_main: false,
              final_release_run_id: String(process.env.GITHUB_RUN_ID || ''),
              final_release_commit: '',
              notes: 'Realny test geometrii iPhone + build GO; oczekuje na backup Drive.'
            },
            postdeploy_diagnostics: {
              evidence_required: true,
              checked: false,
              last_24h: true,
              checked_at: null,
              result: 'PENDING',
              production_version_verified: false,
              service_worker_verified: false,
              evidence_file: 'post-deploy-evidence.json',
              notes: 'Do wykonania po produkcyjnym wdrożeniu 10.70.'
            }
          };
          fs.writeFileSync('RELEASE-GATE.json', JSON.stringify(gate,null,2)+'\n');
          NODE

      - name: Verify pre-release gate
        run: node scripts/release-policy-gate.cjs

      - name: Create release ZIP
        run: node scripts/release-zip.cjs

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wawis-final-release-v10.70
          path: releases/klima-app-v10.70.zip
          if-no-files-found: error

      - name: Commit release metadata and remove temp workflow
        run: |
          git config user.name 'wawis-klima'
          git config user.email 'wasik@wawis.pl'
          git add README.md CHANGELOG.md RELEASE-GATE.json
          git add -u .github/workflows/v1070-finalize-temp.yml
          git commit -m 'WAWIS 10.70: zapisz finalne metadane i ZIP evidence'
          git push origin HEAD:release/v10.70
