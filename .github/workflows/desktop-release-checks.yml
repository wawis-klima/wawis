name: Desktop release checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  verify-desktop-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run full desktop release verification
        run: npm run release:desktop -- --skip-version-bump

      - name: Upload verified release ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wawis-desktop-release
          path: releases/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload release result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wawis-desktop-release-result
          path: RELEASE-RESULT.md
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wawis-desktop-playwright
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Release summary
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## ZIELONY — desktopowe wydanie przeszło pełną weryfikację." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## CZERWONY — desktopowe wydanie nie przeszło pełnej weryfikacji." >> "$GITHUB_STEP_SUMMARY"
            echo "Nie publikuj tej wersji." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mark failed release explicitly
        if: failure()
        run: echo "CZERWONY — Nie publikuj tej wersji."
