name: Desktop release checks

on:
  workflow_dispatch:

env:
  CI: true
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  npm_config_registry: https://registry.npmjs.org/
  NPM_CONFIG_INCLUDE: optional
  NPM_CONFIG_AUDIT: false
  NPM_CONFIG_FUND: false

jobs:
  desktop-release:
    name: release:desktop runner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop release checks
        run: npm run release:desktop -- --skip-version-bump

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: klima-app-release-zip
          path: releases/*.zip
          if-no-files-found: error

      - name: Upload release result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-result
          path: RELEASE-RESULT.md
          if-no-files-found: ignore

      - name: Upload visual verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-visual-verification
          path: visual-artifacts/*.png
          if-no-files-found: ignore

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
