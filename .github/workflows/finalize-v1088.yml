name: WAWIS finalize 10.88

on:
  push:
    branches:
      - release/v10.88
    paths:
      - .github/workflows/finalize-v1088.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=optional --registry=https://registry.npmjs.org/
      - name: Bump version through canonical project helper
        run: |
          node -e "const v=require('./app-version.json').version; if(v==='10.87') require('./version-bump.cjs').bumpVersion(); else if(v!=='10.88') throw new Error('Unexpected starting version '+v);"
      - name: Verify audit contracts after bump
        run: node scripts/smoke-audit-fixes-v1088.mjs
      - name: Verify affected groups after bump
        run: node scripts/run-test-group.cjs jobs photos protocol fuel nameplates
      - name: Production build
        run: npm run build
      - name: Remove generated verification artifacts and one-shot workflow
        run: |
          rm -rf output/pdf
          rm .github/workflows/finalize-v1088.yml
      - name: Commit finalized version files
        run: |
          git config user.name "wawis-klima"
          git config user.email "wasik@wawis.pl"
          git add -A
          git commit -m "chore: bump release to 10.88"
          git push origin HEAD:release/v10.88
