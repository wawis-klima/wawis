name: WAWIS 10.86 final cleanup runner

on:
  push:
    branches:
      - release/v10.86
    paths:
      - .github/workflows/run-harden-v1086-r2.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v10.86
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=optional --registry=https://registry.npmjs.org/
      - name: Restore README from main and apply only 10.86 metadata
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:README.md > README.md
          node <<'NODE'
          const fs = require('node:fs');
          let s = fs.readFileSync('README.md','utf8');
          s = s.replace(/## Aktualna wersja\s*\r?\n-\s*[0-9]+\.[0-9]{2}/m, '## Aktualna wersja\n- 10.86');
          const line = '## Ostatnia poprawka\n- wersja `10.86` — F3/F5/F8/F9: ochrona sesji przed spóźnionym SIGNED_OUT, izolacja kolejki zdjęć między kontami oraz bezpieczna kolejność synchronizacji i kursora offline.';
          if (/## Ostatnia poprawka\s*\r?\n- wersja\s*`?[0-9]+\.[0-9]{2}`?.*/m.test(s)) {
            s = s.replace(/## Ostatnia poprawka\s*\r?\n- wersja\s*`?[0-9]+\.[0-9]{2}`?.*/m, line);
          } else {
            throw new Error('Brak sekcji Ostatnia poprawka w README main');
          }
          fs.writeFileSync('README.md', s);
          NODE
          rm -f scripts/apply-v1086-once.cjs .github/workflows/run-harden-v1086-r2.yml
      - name: Verify clean candidate
        run: |
          node scripts/smoke-audit-fixes-v1086.mjs
          node scripts/smoke-audit-races-v1084.mjs
          node scripts/smoke-mobile-auth-resilience-v974.mjs
          node scripts/smoke-mobile-offline-photo-queue.cjs
          node scripts/release-policy-gate.cjs
          npm run build
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '10.86: clean final release candidate'
          git push origin HEAD:release/v10.86
