name: WAWIS final release checks

on:
  push:
    branches:
      - release/v10.74

permissions:
  contents: write

jobs:
  prepare-release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write 10.74 release notes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const readmePath = 'README.md';
          const changelogPath = 'CHANGELOG.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          const marker = '## Ostatnia poprawka\n';
          const newLine = '- wersja `10.74` — zapis protokołów PDF i zdjęć licznika uzgadnia stan bazy po niejednoznacznej odpowiedzi; plik pozostaje w Storage, dopóki nie ma pewności, że rekord nie powstał.\n';
          if (!readme.includes(newLine)) {
            if (!readme.includes(marker)) throw new Error('Brak sekcji Ostatnia poprawka w README.');
            readme = readme.replace(marker, marker + newLine);
          }
          fs.writeFileSync(readmePath, readme);

          let changelog = fs.readFileSync(changelogPath, 'utf8');
          const placeholder = '## 10.74\n- uzupełnij opis zmian dla wersji 10.74';
          const releaseNotes = '## 10.74\n- Naprawiono zapis protokołów PDF: przy utraconej lub niejednoznacznej odpowiedzi po INSERT/UPDATE aplikacja najpierw odczytuje rekord i nie usuwa nowego pliku, dopóki nie potwierdzi braku zapisu.\n- Przy zastępowaniu protokołu stary PDF jest usuwany dopiero po potwierdzeniu, że rekord wskazuje na nowy plik.\n- Naprawiono analogiczny scenariusz zdjęcia licznika przy tankowaniu; uzgodnienie odbywa się po unikalnej ścieżce `odometer_photo_path`.\n- Dodano test regresji v10.74 dla udanego commitu z utraconą odpowiedzią, błędu odczytu kontrolnego i jednoznacznie nieudanego zapisu.';
          if (changelog.includes(placeholder)) changelog = changelog.replace(placeholder, releaseNotes);
          fs.writeFileSync(changelogPath, changelog);
          NODE

      - name: Commit release notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Release notes already finalized."
          else
            git commit -m "docs: finalize 10.74 release notes"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
