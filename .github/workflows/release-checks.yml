name: WAWIS final release checks

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Zakres finalnego wydania
        required: true
        default: full
        type: choice
        options:
          - full
          - mobile
          - desktop

concurrency:
  group: wawis-final-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  final-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout selected release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Pre-release policy gate
        run: node scripts/release-policy-gate.cjs

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run one final release pass
        run: node scripts/run-release.cjs "${{ inputs.scope }}" --skip-version-bump

      - name: Upload final ZIP and release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wawis-final-release-${{ github.ref_name }}
          path: |
            releases/klima-app-v*.zip
            RELEASE-RESULT.md
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
