name: WAWIS final release checks

on:
  push:
    branches:
      - release/v10.75
  workflow_dispatch:
    inputs:
      scope:
        description: Tryb wydania — AUTO sam dobiera zakres do zmian
        required: true
        default: auto
        type: choice
        options:
          - auto
          - full
          - mobile
          - desktop

concurrency:
  group: wawis-final-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  final-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout selected release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch production base
        run: git fetch origin main:refs/remotes/origin/main --force

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Pre-release policy gate
        run: node scripts/release-policy-gate.cjs

      - name: Detect automatic release profile
        id: impact
        run: node scripts/release-impact.cjs --base-ref origin/main --json RELEASE-IMPACT.json --github-output "$GITHUB_OUTPUT"

      - name: Install Chromium for Playwright when needed
        if: github.event_name == 'push' || inputs.scope != 'auto' || steps.impact.outputs.needs_playwright == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run one final release pass
        run: node scripts/run-release.cjs full --base-ref origin/main --skip-version-bump

      - name: Upload final ZIP and release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wawis-final-release-v10.75
          path: |
            releases/klima-app-v*.zip
            RELEASE-RESULT.md
            RELEASE-IMPACT.json
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
