name: WAWIS final release checks

on:
  push:
    branches:
      - release/v10.74
  workflow_dispatch:
    inputs:
      scope:
        description: Tryb wydania — AUTO sam dobiera zakres do zmian
        required: true
        default: auto
        type: choice
        options:
          - auto
          - full
          - mobile
          - desktop

concurrency:
  group: wawis-final-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Synchronize version 10.74
        run: node version-bump.cjs 10.74

      - name: Commit synchronized version files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-version.json public/app-version.json package.json package-lock.json src/version.js src/mobile791/version.js public/push-sw.js README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Version files already synchronized."
          else
            git commit -m "chore: bump app version to 10.74"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
