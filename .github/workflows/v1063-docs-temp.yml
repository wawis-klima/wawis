name: WAWIS 10.63 update release docs

on:
  push:
    branches:
      - release/v10.63
    paths:
      - .github/workflows/v1063-docs-temp.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v10.63
          fetch-depth: 0

      - name: Update README and CHANGELOG from release notes
        run: node scripts/update-release-docs.cjs

      - name: Commit release docs
        shell: bash
        run: |
          if git diff --quiet README.md CHANGELOG.md; then
            echo "Release docs already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md
          git commit -m "WAWIS 10.63 — update release documentation"
          git push origin HEAD:release/v10.63
