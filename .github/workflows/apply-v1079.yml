name: Apply v10.79 changes

on:
  push:
    branches: [release/v10.79]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v10.79
          fetch-depth: 0

      - name: Apply 10.79 source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for rel, import_line in [
              ('src/modules/jobs-fetch.js', 'import { normalizeStatus as normalizeJobStatus } from "../utils/jobPermissions.js";\n'),
              ('src/mobile791/modules/jobs-fetch.js', 'import { normalizeStatus as normalizeJobStatus } from "../utils/jobPermissions.js";\n'),
          ]:
              path = Path(rel)
              source = path.read_text()
              source = source.replace(import_line, '')
              source, count = re.subn(
                  r'\nasync function syncStaleJobsStatus\(\{.*?\n\}\n\n(?=(?:function|getExisting|async function))',
                  '\n',
                  source,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'{rel}: nie znaleziono syncStaleJobsStatus')
              source = source.replace('  normalizeStatus = normalizeJobStatus,\n  isOlderThan30Days,\n', '')
              source, count = re.subn(
                  r'  const \{ jobsData: initialJobsData, jobsFields \} = await jobsPromise;\n  const jobsData = await syncStaleJobsStatus\(\{\n    supabase,\n    jobsData: initialJobsData,\n    jobsFields,\n    normalizeStatus,\n    isOlderThan30Days,\n  \}\);',
                  '  const { jobsData } = await jobsPromise;',
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'{rel}: nie znaleziono wywołania syncStaleJobsStatus')
              path.write_text(source)

          smoke = Path('scripts/smoke-auth-refresh.cjs')
          source = smoke.read_text()
          source = source.replace("  assert.equal(payload.jobs[0].status, 'Niezrealizowane');", "  assert.equal(payload.jobs[0].status, 'Nowe zlecenie');")
          if source.count("assert.equal(payload.jobs[0].status, 'Nowe zlecenie');") < 2:
              raise SystemExit('smoke-auth-refresh: nie poprawiono obu asercji statusu')
          smoke.write_text(source)
          PY

      - name: Add Supabase migration and regression test
        shell: bash
        run: |
          cat > supabase/migrations/20260916103000_mobile_feed_and_stale_job_maintenance_v1079.sql <<'SQL'
          -- WAWIS 10.79 — wspólny feed zmian dla całego zespołu oraz
          -- serwerowe starzenie statusu Nowe -> Niezrealizowane po 30 dniach.

          begin;

          -- Od 10.60 każdy pracownik widzi wszystkie montaże. Feed 10.10 nadal
          -- kierował globalny wpis wyłącznie do administratora, dlatego pracownik
          -- nieprzypisany do zlecenia mógł ominąć przyrostową zmianę.
          create or replace function public.record_mobile_job_change()
          returns trigger
          language plpgsql
          security definer
          set search_path = public, pg_temp
          as $$
          declare
            v_job_id uuid;
          begin
            if tg_op = 'DELETE' then
              v_job_id := old.id;
            else
              v_job_id := new.id;
            end if;

            insert into public.mobile_change_feed (audience_user_id, job_id, change_kind)
            values (null, v_job_id, lower(tg_op));

            if tg_op = 'DELETE' then return old; end if;
            return new;
          end;
          $$;

          revoke all on function public.record_mobile_job_change() from public, anon, authenticated;

          create or replace function public.record_mobile_job_access_change()
          returns trigger
          language plpgsql
          security definer
          set search_path = public, pg_temp
          as $$
          declare
            v_job_id uuid;
          begin
            if tg_op = 'DELETE' then v_job_id := old.job_id; else v_job_id := new.job_id; end if;

            -- job_access nadal wpływa na metadane viewerów w aplikacji, ale nie na
            -- widoczność samego montażu; jedna zmiana globalna wystarcza całemu zespołowi.
            insert into public.mobile_change_feed (audience_user_id, job_id, change_kind)
            values (null, v_job_id, 'access_' || lower(tg_op));

            if tg_op = 'DELETE' then return old; end if;
            return new;
          end;
          $$;

          revoke all on function public.record_mobile_job_access_change() from public, anon, authenticated;

          create or replace function public.get_mobile_change_batch(
            p_after_seq bigint default 0,
            p_limit integer default 100
          )
          returns table (
            change_seq bigint,
            job_id uuid,
            change_kind text,
            changed_at timestamptz
          )
          language plpgsql
          stable
          security definer
          set search_path = public, pg_temp
          as $$
          begin
            if not public.current_user_is_staff() then
              return;
            end if;

            return query
            select f.change_seq, f.job_id, f.change_kind, f.changed_at
            from public.mobile_change_feed f
            where f.change_seq > greatest(coalesce(p_after_seq, 0), 0)
              and f.audience_user_id is null
            order by f.change_seq
            limit least(greatest(coalesce(p_limit, 100), 1), 250);
          end;
          $$;

          create or replace function public.get_mobile_change_head()
          returns bigint
          language sql
          stable
          security definer
          set search_path = public, pg_temp
          as $$
            select case
              when public.current_user_is_staff() then coalesce(max(f.change_seq), 0)
              else 0
            end
            from public.mobile_change_feed f
            where f.audience_user_id is null;
          $$;

          revoke all on function public.get_mobile_change_batch(bigint, integer) from public, anon;
          revoke all on function public.get_mobile_change_head() from public, anon;
          grant execute on function public.get_mobile_change_batch(bigint, integer) to authenticated, service_role;
          grant execute on function public.get_mobile_change_head() to authenticated, service_role;

          -- Jednorazowa globalna migawka po zmianie modelu widoczności. Dzięki temu
          -- każdy telefon dostanie sekwencje nowsze od swojego starego kursora.
          insert into public.mobile_change_feed (audience_user_id, job_id, change_kind)
          select null, j.id, 'v1079_bootstrap'
          from public.jobs j;

          -- Stary klient wykonywał UPDATE statusu podczas zwykłego odczytu listy.
          -- Przenosimy maintenance do bazy i uruchamiamy go niezależnie od sesji użytkownika.
          create or replace function private.refresh_stale_new_jobs()
          returns integer
          language plpgsql
          security definer
          set search_path = public, pg_temp
          as $$
          declare
            v_changed integer := 0;
          begin
            with changed as (
              update public.jobs
              set status = 'Niezrealizowane'
              where lower(trim(coalesce(status, ''))) in ('nowe', 'nowe zlecenie')
                and created_at < now() - interval '30 days'
              returning 1
            )
            select count(*)::integer into v_changed from changed;

            return coalesce(v_changed, 0);
          end;
          $$;

          revoke all on function private.refresh_stale_new_jobs() from public, anon, authenticated;
          grant execute on function private.refresh_stale_new_jobs() to service_role;

          create extension if not exists pg_cron with schema pg_catalog;
          grant usage on schema cron to postgres;
          grant all privileges on all tables in schema cron to postgres;

          select cron.unschedule(jobid)
          from cron.job
          where jobname = 'wawis-stale-new-jobs-v1079';

          select cron.schedule(
            'wawis-stale-new-jobs-v1079',
            '17 * * * *',
            $cron$select private.refresh_stale_new_jobs();$cron$
          );

          -- Wyrównanie stanu od razu przy wdrożeniu, bez czekania do kolejnej godziny.
          select private.refresh_stale_new_jobs();

          commit;
          SQL

          cat > scripts/smoke-mobile-feed-stale-v1079.mjs <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const read = (path) => fs.readFileSync(path, 'utf8');
          const desktop = read('src/modules/jobs-fetch.js');
          const mobile = read('src/mobile791/modules/jobs-fetch.js');
          const migration = read('supabase/migrations/20260916103000_mobile_feed_and_stale_job_maintenance_v1079.sql');

          for (const [label, source] of [['desktop', desktop], ['mobile', mobile]]) {
            assert.doesNotMatch(source, /syncStaleJobsStatus/, `${label}: odczyt nadal uruchamia maintenance statusu`);
            assert.doesNotMatch(source, /update\(\{\s*status:\s*['"]Niezrealizowane['"]\s*\}\)/, `${label}: odczyt nadal wykonuje UPDATE statusu`);
          }

          assert.match(migration, /record_mobile_job_change/);
          assert.match(migration, /current_user_is_staff\(\)/);
          assert.match(migration, /f\.audience_user_id is null/);
          assert.match(migration, /v1079_bootstrap/);
          assert.match(migration, /private\.refresh_stale_new_jobs/);
          assert.match(migration, /created_at < now\(\) - interval '30 days'/);
          assert.match(migration, /create extension if not exists pg_cron/i);
          assert.match(migration, /cron\.schedule/);
          assert.match(migration, /'17 \* \* \* \*'/);
          assert.match(migration, /revoke all on function private\.refresh_stale_new_jobs\(\) from public, anon, authenticated/i);

          console.log('OK: 10.79 — wspólny feed całego zespołu i serwerowe starzenie statusu bez UPDATE podczas odczytu.');
          JS

      - name: Wire tests and bump version
        shell: bash
        run: |
          node <<'JS'
          const fs = require('fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts['test:smoke:feed-stale-v1079'] = 'node scripts/smoke-mobile-feed-stale-v1079.mjs';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          let groups = fs.readFileSync('scripts/test-groups.cjs', 'utf8');
          const anchor = "    'npm run test:smoke:reliable-sync',\n";
          if (!groups.includes(anchor)) throw new Error('Brak kotwicy test-groups dla reliable-sync');
          groups = groups.replace(anchor, anchor + "    'npm run test:smoke:feed-stale-v1079',\n");
          fs.writeFileSync('scripts/test-groups.cjs', groups);
          JS

          node version-bump.cjs

          node <<'JS'
          const fs = require('fs');

          let readme = fs.readFileSync('README.md', 'utf8');
          readme = readme.replace(
            /- wersja `10\.79` — uzupełnij opis ostatniej poprawki po zakończeniu zmian\./,
            '- wersja `10.79` — wspólny feed zmian dla całego zespołu oraz serwerowe starzenie statusu Nowe po 30 dniach.'
          );
          fs.writeFileSync('README.md', readme);

          let changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          changelog = changelog.replace(
            '## 10.79\n- uzupełnij opis zmian dla wersji 10.79',
            '## 10.79\n- Feed przyrostowy obejmuje wszystkie montaże widoczne dla każdego pracownika, także gdy nie jest przypisany do zlecenia.\n- Automatyczne Nowe → Niezrealizowane po 30 dniach wykonuje baza przez Supabase Cron, a nie telefon podczas odczytu.\n- Desktop i mobile nie wykonują już zapisu statusu przy ładowaniu listy.'
          );
          fs.writeFileSync('CHANGELOG.md', changelog);

          fs.writeFileSync('release-notes.json', JSON.stringify({
            version: '10.79',
            summary: 'Pewny feed zmian dla całego zespołu i serwerowe starzenie statusu Nowe.',
            changes: [
              'Każdy pracownik odbiera zmiany wszystkich montaży, które i tak ma prawo widzieć.',
              'Feed używa jednego globalnego strumienia zmian zamiast wpisów zależnych od przypisania.',
              'Status Nowe przechodzi po 30 dniach do Niezrealizowane po stronie bazy przez Supabase Cron.',
              'Telefon i desktop nie wykonują już UPDATE statusu podczas zwykłego pobierania listy.'
            ]
          }, null, 2) + '\n');

          fs.writeFileSync('RELEASE-GATE.json', JSON.stringify({
            policy_enforced_from: '10.60',
            version: '10.79',
            scope: 'full',
            release_branch: 'release/v10.79',
            baseline_diagnostics: {
              checked: true,
              last_24h: true,
              checked_at: '2026-09-16T10:30:00+02:00',
              result: 'INFO',
              notes: 'Brak zdarzeń 42501 w ostatnich 24 h; pozostałe wpisy diagnostyczne dotyczą głównie miniatur/tabliczek i są poza zakresem 10.79.'
            },
            predeploy_diagnostics: {
              checked: false,
              last_24h: true,
              checked_at: '',
              result: 'INFO_ONLY',
              notes: 'Informacyjne; nie blokuje release.'
            },
            main_protection: {
              source_branch: 'release/v10.79',
              ready_for_main: true,
              required_check: 'WAWIS PR checks / targeted-checks'
            },
            postdeploy_diagnostics: {
              evidence_required: false,
              result: 'INFO_ONLY'
            },
            archive: {
              source_of_truth: 'github-main',
              zip_optional: true,
              blocking: false
            },
            release_mode: 'standard'
          }, null, 2) + '\n');
          JS

      - name: Self-check changed source
        shell: bash
        run: |
          node scripts/smoke-mobile-feed-stale-v1079.mjs
          node scripts/smoke-auth-refresh.cjs
          node scripts/smoke-version-ui.cjs

      - name: Commit release changes
        shell: bash
        run: |
          rm -f .github/workflows/apply-v1079.yml
          git config user.name "wawis-klima"
          git config user.email "wasik@wawis.pl"
          git add -A
          git commit -m "release: v10.79 feed and stale-status maintenance"
          git push origin HEAD:release/v10.79
