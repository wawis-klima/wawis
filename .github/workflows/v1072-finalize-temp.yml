name: WAWIS 10.72 finalize temp

on:
  push:
    branches:
      - release/v10.72
    paths:
      - .github/workflows/v1072-finalize-temp.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary workflow
        run: rm -f .github/workflows/v1072-finalize-temp.yml

      - name: Write final release metadata and gate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          let readme = fs.readFileSync('README.md','utf8');
          readme = readme.replace(
            /## Ostatnia poprawka\s*\n- wersja `10\.72` — uzupełnij opis ostatniej poprawki po zakończeniu zmian\./m,
            '## Ostatnia poprawka\n- wersja `10.72` — skrajne odstępy mobilnego paska zmniejszono z 6 px do 2,5 px (około 60%); rozmiary ikon pozostają bez zmian, a odzyskane miejsce zwiększa przerwy między kontrolkami.'
          );
          fs.writeFileSync('README.md', readme);

          let changelog = fs.readFileSync('CHANGELOG.md','utf8');
          changelog = changelog.replace(
            /## 10\.72\n- uzupełnij opis zmian dla wersji 10\.72/,
            '## 10.72\n- skrajne odstępy mobilnego paska zmniejszono z 6 px do 2,5 px (około 60%); rozmiary ikon pozostają bez zmian, a odzyskane miejsce trafia pomiędzy kontrolki.\n- realny test geometrii na profilu iPhone 14 potwierdza równe skrajne odstępy około 2,5 px oraz większe, równe przerwy wewnętrzne.'
          );
          fs.writeFileSync('CHANGELOG.md', changelog);

          const gate = {
            policy_enforced_from: '10.60',
            version: '10.72',
            scope: 'mobile',
            release_branch: 'release/v10.72',
            baseline_diagnostics: {
              checked: true,
              last_24h: true,
              checked_at: '2026-09-15T17:26:26.290617Z',
              result: 'GO',
              notes: '24 h: 15 wcześniejszych warning/error; od wdrożenia 10.71 brak nowych problemów (0). Zmiana 10.72 dotyczy wyłącznie geometrii mobilnego paska.'
            },
            predeploy_diagnostics: {
              checked: true,
              last_24h: true,
              checked_at: '2026-09-15T17:26:26.290617Z',
              result: 'GO',
              notes: 'Od wdrożenia 10.71 brak nowych warning/error (0). Realny test geometrii iPhone, targeted smokes i build 10.72 są zielone.'
            },
            drive_backup: {
              required: true,
              folder_path: 'Aplikacja/Wersje',
              folder_id: '1eufcE1gnbfw7t2IMmJwbcicrkaiaqu0S',
              file_name: 'klima-app-v10.72.zip',
              file_id: '1JcoJoqfzPf7iCPr1-vop159tmwHVkiMV',
              size_bytes: 12063593,
              uploaded: true,
              uploaded_at: '2026-09-15T17:25:32.966Z',
              verified: true,
              notes: 'ZIP po zielonym realnym teście iPhone, targeted smokes i buildzie 10.72 zweryfikowany na Google Drive.'
            },
            main_protection: {
              source_branch: 'release/v10.72',
              ready_for_main: true,
              final_release_run_id: '35001016396',
              final_release_commit: 'c32bc50d660dbb2d4f4056785e7595f06f22abc7',
              notes: 'Targeted smokes + realny test iPhone + build GO; backup Drive zweryfikowany; gotowe do produkcyjnego deployu.'
            },
            postdeploy_diagnostics: {
              evidence_required: true,
              checked: false,
              last_24h: true,
              checked_at: null,
              result: 'PENDING',
              production_version_verified: false,
              service_worker_verified: false,
              evidence_file: 'post-deploy-evidence.json',
              notes: 'Do wykonania po produkcyjnym wdrożeniu 10.72.'
            }
          };
          fs.writeFileSync('RELEASE-GATE.json', JSON.stringify(gate,null,2)+'\n');
          NODE

      - name: Exact Vercel deploy gate
        run: node scripts/release-policy-gate.cjs --deploy

      - name: Commit final gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "WAWIS 10.72: finalna bramka produkcyjna"
          git push origin HEAD:release/v10.72
