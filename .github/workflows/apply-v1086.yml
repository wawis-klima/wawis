name: WAWIS 10.86 audited fixer

on:
  push:
    branches:
      - release/v10.86
    paths:
      - scripts/apply-v1086-once.cjs
      - .github/workflows/apply-v1086.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v10.86
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=optional --registry=https://registry.npmjs.org/
      - name: Correct one-shot marker for current hook layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-v1086-once.cjs')
          s = p.read_text()
          old = "`  const clearLocalState = useCallback(() => {`"
          new = "`  async function login(credentials = {}) {`"
          if old not in s:
              raise SystemExit('expected old marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply 10.86 fixes
        run: node scripts/apply-v1086-once.cjs
      - name: Normalize generated guards and regression test
        run: |
          python - <<'PY'
          from pathlib import Path
          photos = Path('src/mobile791/modules/photos.js')
          s = photos.read_text()
          repairs = {
            "const guardedSetJobs = (updater) => { if (isSessionCurrent()) guardedSetJobs?.(updater); };": "const guardedSetJobs = (updater) => { if (isSessionCurrent()) setJobs?.(updater); };",
            "const guardedSetSelectedJob = (updater) => { if (isSessionCurrent()) guardedSetSelectedJob?.(updater); };": "const guardedSetSelectedJob = (updater) => { if (isSessionCurrent()) setSelectedJob?.(updater); };",
            "const guardedOnPhotoUploadError = (...args) => { if (isSessionCurrent()) guardedOnPhotoUploadError?.(...args); };": "const guardedOnPhotoUploadError = (...args) => { if (isSessionCurrent()) onPhotoUploadError?.(...args); };",
          }
          for old, new in repairs.items():
              s = s.replace(old, new)
          photos.write_text(s)

          test = Path('scripts/smoke-audit-fixes-v1086.mjs')
          t = test.read_text()
          old = "assert.doesNotMatch(changedBlock, /updateOfflineSyncCursor(/);"
          new = "assert.equal(changedBlock.includes('updateOfflineSyncCursor('), false, 'refreshChanged must not advance cursor outside atomic snapshot commit');"
          if old not in t:
              raise SystemExit('invalid cursor regex assertion not found')
          t = t.replace(old, new, 1)
          lines = t.splitlines()
          replaced = False
          for i, line in enumerate(lines):
              if 'late auth catch must be generation-guarded' in line and 'assert.match' in line:
                  lines[i] = "  assert.equal(source.includes(\"} catch (error) {\\n      if (disposed || !isAuthOperationCurrent(verificationToken)) return;\"), true, file + ': late auth catch must be generation-guarded');"
                  replaced = True
          if not replaced:
              raise SystemExit('auth assertion line not found')
          test.write_text('\n'.join(lines) + '\n')
          PY
      - name: Run 10.86 regressions
        run: |
          node scripts/smoke-audit-fixes-v1086.mjs
          node scripts/smoke-audit-races-v1084.mjs
          node scripts/smoke-mobile-auth-resilience-v974.mjs
          node scripts/smoke-mobile-offline-photo-queue.cjs
      - name: Production build
        run: npm run build
      - name: Commit verified fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts/test-groups.cjs scripts/smoke-audit-fixes-v1086.mjs
          git commit -m '10.86: guard session photos and atomic sync cursor'
          git push origin HEAD:release/v10.86
