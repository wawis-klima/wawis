name: Build Wawis 10.49 archive

on:
  push:
    branches:
      - build-archive-v10.49

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release state
        uses: actions/checkout@v4
        with:
          ref: ad410c9be68280ece2e97ccbf7d20f03823ab1ef

      - name: Build full release ZIP
        run: npm run zip:release

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: klima-app-v10.49
          path: releases/klima-app-v10.49.zip
          if-no-files-found: error
          retention-days: 30
