name: WAWIS prepare v10.67 temp

on:
  push:
    branches:
      - release/v10.67
    paths:
      - .github/workflows/prepare-v1067-temp.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump WAWIS to 10.67
        run: node version-bump.cjs

      - name: Write 10.67 release metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = '10.67';
          const notes = {
            version,
            summary: 'Wydanie 10.67 przygotowuje poprawki mobilne z 10.65–10.66 i uszczelnia bezpieczny model GitHub → jeden produkcyjny deploy Vercela z main.',
            changes: [
              'Mobile: prawy odstęp paska akcji ma 24 px, dzięki czemu przycisk PW jest wyraźnie odsunięty od prawej krawędzi.',
              'iPhone/PWA: aplikacja sprawdza produkcyjny app-version.json po powrocie z tła i automatycznie odświeża nowszą wersję.',
              'Vercel: automatyczne Preview są blokowane dla wszystkich gałęzi roboczych, także release/* i runner/*; automatyczny deploy pozostaje wyłącznie dla main.',
              'Vercel: dodatkowy guard odrzuca build, jeśli środowisko nie jest production albo commit nie pochodzi z main.',
              'Bezpieczeństwo wydania pozostaje wielowarstwowe: klasyfikacja FAST/TARGETED/CRITICAL, release gate, finalny ZIP, backup Drive i post-deploy evidence.'
            ]
          };
          fs.writeFileSync('release-notes.json', JSON.stringify(notes, null, 2) + '\n');

          const gate = {
            policy_enforced_from: '10.60',
            version,
            scope: 'full',
            release_branch: 'release/v10.67',
            baseline_diagnostics: {
              checked: false,
              last_24h: true,
              checked_at: null,
              result: 'PENDING',
              notes: 'Do wykonania przed finalnym wydaniem 10.67. Wersja jest przygotowana, ale celowo nie jest jeszcze gotowa do main ani Vercela.'
            },
            predeploy_diagnostics: {
              checked: false,
              last_24h: true,
              checked_at: null,
              result: 'PENDING',
              notes: 'Do wykonania po pełnym CRITICAL final release bezpośrednio przed merge do main.'
            },
            drive_backup: {
              required: true,
              folder_path: 'Aplikacja/Wersje',
              folder_id: '1eufcE1gnbfw7t2IMmJwbcicrkaiaqu0S',
              file_name: 'klima-app-v10.67.zip',
              file_id: '',
              size_bytes: 0,
              uploaded: false,
              uploaded_at: null,
              verified: false,
              notes: 'Aktualny ZIP 10.67 ma powstać po zielonym pełnym CRITICAL final release i zostać ponownie zweryfikowany na Google Drive.'
            },
            main_protection: {
              source_branch: 'release/v10.67',
              ready_for_main: false,
              final_release_run_id: '',
              final_release_commit: '',
              notes: 'NO-GO do czasu pełnego CRITICAL final release, pre-deploy GO, ZIP/Drive GO i świadomego merge do main.'
            },
            postdeploy_diagnostics: {
              evidence_required: true,
              checked: false,
              last_24h: true,
              checked_at: null,
              result: 'PENDING',
              production_version_verified: false,
              service_worker_verified: false,
              evidence_file: 'post-deploy-evidence.json',
              notes: 'Do wykonania dopiero po późniejszym produkcyjnym wdrożeniu 10.67 na Vercelu.'
            }
          };
          fs.writeFileSync('RELEASE-GATE.json', JSON.stringify(gate, null, 2) + '\n');
          NODE
          node scripts/update-release-docs.cjs

      - name: Sanity-check prepared metadata
        run: |
          node scripts/smoke-release-automation-v1061.cjs
          node scripts/smoke-release-impact-v1063.cjs
          node -e "const a=require('./app-version.json'); const g=require('./RELEASE-GATE.json'); if(a.version!=='10.67'||g.version!=='10.67'||g.main_protection.ready_for_main!==false) process.exit(1);"

      - name: Commit prepared 10.67 without deployment
        run: |
          git config user.name 'wawis-klima'
          git config user.email 'wasik@wawis.pl'
          git add app-version.json public/app-version.json package.json package-lock.json src/version.js src/mobile791/version.js public/push-sw.js README.md CHANGELOG.md release-notes.json RELEASE-GATE.json
          git commit -m 'WAWIS 10.67 — przygotowanie bez wdrożenia'
          git push origin HEAD:release/v10.67
