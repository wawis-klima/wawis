name: WAWIS bootstrap 10.76

on:
  push:
    branches:
      - release/v10.76
    paths:
      - '.github/workflows/bootstrap-v1076.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v10.76
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply 10.76 changes
        run: python3 scripts/bootstrap-v1076.py
      - name: Validate changed sources
        run: |
          node --check src/modules/auth.js
          node --check src/mobile791/modules/auth.js
          node --check src/modules/push-subscriptions.js
          node --check src/mobile791/modules/push-subscriptions.js
          npm run test:smoke:push-logout-handoff
          npm run test:smoke:push-mobile-reassignment
      - name: Remove temporary bootstrap files
        run: git rm scripts/bootstrap-v1076.py .github/workflows/bootstrap-v1076.yml
      - name: Commit release changes
        run: |
          git config user.name "wawis-klima"
          git config user.email "wasik@wawis.pl"
          git add -A
          git commit -m "release: prepare 10.76 push logout and account handoff"
          git push origin HEAD:release/v10.76
