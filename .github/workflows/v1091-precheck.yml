name: WAWIS 10.91 one-shot pre-release check

on:
  push:
    branches:
      - release/v10.91

permissions:
  contents: write

jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/v10.91
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=optional --registry=https://registry.npmjs.org/
      - name: Version consistency
        run: npm run test:smoke:version
      - name: Existing nameplate completion regression
        run: npm run test:smoke:nameplate-finish-verification
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: 10.91 focused mobile regressions
        run: npx playwright test tests/e2e/mobile-v1091-regressions.spec.js --reporter=line
      - name: Production build
        run: npm run build
      - name: Verify release metadata
        run: node scripts/verify-release.cjs
      - name: Remove one-shot workflow after green precheck
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v1091-precheck.yml
          node <<'NODE'
          const fs = require('fs');
          const path = 'RELEASE-GATE.json';
          const gate = JSON.parse(fs.readFileSync(path, 'utf8'));
          gate.predeploy_diagnostics = {
            checked: true,
            last_24h: true,
            checked_at: new Date().toISOString(),
            result: 'PASS',
            notes: '10.91 precheck PASS: spójność wersji, istniejący smoke wymogu tabliczek, nowe Playwright regresje overflow + mobilne ręczne potwierdzenia oraz production build.'
          };
          gate.main_protection.ready_for_main = true;
          fs.writeFileSync(path, JSON.stringify(gate, null, 2) + '\n');
          NODE
          git config user.name "wawis-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test(v10.91): record green mobile precheck"
          git push origin HEAD:release/v10.91
