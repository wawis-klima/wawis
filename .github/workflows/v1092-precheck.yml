name: WAWIS 10.92 focused pre-release

on:
  push:
    branches: [release/v10.92]
    paths:
      - '.github/workflows/v1092-precheck.yml'

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v10.92
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=optional --registry=https://registry.npmjs.org/
      - name: Version consistency
        run: npm run test:smoke:version
      - name: Worker/admin nameplate finish smoke
        run: npm run test:smoke:nameplate-finish-verification
      - name: Desktop/manual status smoke
        run: npm run test:smoke:desktop-nameplate-verification-status
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: 10.91 + 10.92 focused regressions
        run: npx playwright test tests/e2e/mobile-v1091-regressions.spec.js tests/e2e/mobile-v1092-regressions.spec.js --reporter=line
      - name: Full mobile WebKit layout
        run: npx playwright test tests/e2e/mobile-v1092-full-layout.spec.js --config=playwright.v1092-webkit.config.js
      - name: Verify release metadata
        run: node scripts/verify-release.cjs
      - name: Production build
        run: npm run build
