name: WAWIS 10.62 single final mobile release

on:
  pull_request:
    branches: [main]

concurrency:
  group: wawis-v1062-single-final
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  final-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Detect one-time trigger commit
        id: trigger
        shell: bash
        run: |
          if git diff-tree --no-commit-id --name-only -r HEAD | grep -Fxq '.github/workflows/release-v1061-final-pr.yml'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.trigger.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.trigger.outputs.run == 'true'
        run: npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Pre-release policy gate
        if: steps.trigger.outputs.run == 'true'
        run: node scripts/release-policy-gate.cjs

      - name: Install Chromium for Playwright
        if: steps.trigger.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run one final mobile release pass
        if: steps.trigger.outputs.run == 'true'
        run: node scripts/run-release.cjs mobile --skip-version-bump

      - name: Upload final ZIP and release report
        if: ${{ always() && steps.trigger.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: wawis-final-release-v10.62
          path: |
            releases/klima-app-v10.62.zip
            RELEASE-RESULT.md
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
