name: Run v10.80 candidate

on:
  push:
    branches:
      - release/v10.80

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v10.80
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Detect already prepared candidate
        id: state
        shell: bash
        run: |
          if node -e "const v=require('./app-version.json').version; process.exit(v==='10.80' ? 0 : 1)" && test -f src/mobile791/modules/session-generation.js; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply source patch from reviewed bootstrap
        if: steps.state.outputs.already != 'true'
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, textwrap
          source = Path('.github/workflows/apply-v1080.yml').read_text(encoding='utf-8')
          blocks = re.findall(r"          python3 <<'PY'\n(.*?)\n          PY", source, flags=re.S)
          if len(blocks) < 2:
              raise SystemExit(f'Oczekiwano 2 bloków Python, znaleziono {len(blocks)}')
          code = textwrap.dedent(blocks[0])
          exec(compile(code, 'apply-v1080-source.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Bump and document 10.80
        if: steps.state.outputs.already != 'true'
        shell: bash
        run: |
          node version-bump.cjs
          python3 <<'PY'
          from pathlib import Path
          import re, textwrap
          source = Path('.github/workflows/apply-v1080.yml').read_text(encoding='utf-8')
          blocks = re.findall(r"          python3 <<'PY'\n(.*?)\n          PY", source, flags=re.S)
          code = textwrap.dedent(blocks[1])
          exec(compile(code, 'apply-v1080-docs.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install dependencies
        if: steps.state.outputs.already != 'true'
        run: npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Focused regressions
        if: steps.state.outputs.already != 'true'
        run: |
          node scripts/smoke-session-sync-resilience-v1080.mjs
          node scripts/smoke-mobile-offline-resilience-v1075.mjs
          node scripts/smoke-auth-refresh.cjs
          node scripts/smoke-version-ui.cjs

      - name: Install Chromium
        if: steps.state.outputs.already != 'true'
        run: npx playwright install --with-deps chromium

      - name: Real IndexedDB regression
        if: steps.state.outputs.already != 'true'
        run: npx playwright test tests/e2e/mobile-offline-atomic-v1075.spec.js

      - name: Commit verified release candidate
        if: steps.state.outputs.already != 'true'
        shell: bash
        run: |
          git config user.name "wawis-klima"
          git config user.email "wasik@wawis.pl"
          git add -A
          git commit -m "release: prepare 10.80 session and sync resilience"
          git push origin HEAD:release/v10.80
