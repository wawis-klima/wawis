name: WAWIS Release Policy Gate

on:
  workflow_dispatch:

concurrency:
  group: wawis-release-policy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-policy-gate:
    runs-on: ubuntu-24.04  # 13.80: przypięte — GitHub przenosi ubuntu-latest na Ubuntu 26 (od 19.10.2026)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate WAWIS release policy
        run: node scripts/release-policy-gate.cjs
