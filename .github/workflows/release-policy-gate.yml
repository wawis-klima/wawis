name: WAWIS Release Policy Gate

on:
  workflow_dispatch:

concurrency:
  group: wawis-release-policy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-policy-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate WAWIS release policy
        run: node scripts/release-policy-gate.cjs
