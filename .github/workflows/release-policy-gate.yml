name: WAWIS Release Policy Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-policy-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate WAWIS release policy
        run: node scripts/release-policy-gate.cjs
