name: One-time WAWIS 10.57 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-10-57-once.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify protocol print module syntax
        run: node --check src/mobile791/modules/job-protocol-storage.js

      - name: Set official next version from 10.56 to 10.57
        run: node version-bump.cjs

      - name: Commit official 10.57 version metadata
        run: |
          git config user.name "wawis-klima"
          git config user.email "wasik@wawis.pl"
          git add app-version.json package.json package-lock.json src/version.js src/mobile791/version.js README.md CHANGELOG.md
          git commit -m "WAWIS 10.57: official release version after 10.56"
          git push origin HEAD:main

      - name: Build release ZIP
        run: node scripts/release-zip.cjs

      - name: Upload WAWIS 10.57 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: klima-app-v10.57
          path: releases/klima-app-v10.57.zip
          if-no-files-found: error
          retention-days: 7
