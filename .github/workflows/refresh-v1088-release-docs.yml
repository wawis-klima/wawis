name: WAWIS refresh 10.88 release docs

on:
  push:
    branches:
      - release/v10.88
    paths:
      - .github/workflows/refresh-v1088-release-docs.yml

permissions:
  contents: write

jobs:
  refresh-release-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update README and CHANGELOG from release notes
        run: node scripts/update-release-docs.cjs
      - name: Verify pre-release policy
        run: node scripts/release-policy-gate.cjs
      - name: Verify release metadata
        run: node scripts/verify-release.cjs --allow-no-build
      - name: Remove one-shot workflow
        run: rm .github/workflows/refresh-v1088-release-docs.yml
      - name: Commit release docs
        run: |
          git config user.name "wawis-klima"
          git config user.email "wasik@wawis.pl"
          git add -A
          git commit -m "docs: finalize 10.88 release metadata"
          git push origin HEAD:release/v10.88
