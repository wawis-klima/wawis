name: WAWIS 10.62 post-deploy verification

on:
  push:
    branches:
      - release/v10.62
    paths:
      - .github/workflows/postdeploy-v1062-temp.yml

permissions:
  contents: read

jobs:
  post-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v10.62

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify live production and Supabase diagnostics
        run: >-
          node scripts/post-deploy-check.mjs
          --url "https://wawis.pages.dev"
          --deployment-start "2026-09-15T04:40:22Z"

      - name: Close release gate using live evidence
        run: node scripts/release-policy-gate.cjs --post --evidence post-deploy-evidence.json

      - name: Upload post-deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wawis-post-deploy-evidence-v10.62
          path: post-deploy-evidence.json
          if-no-files-found: warn
          retention-days: 30
