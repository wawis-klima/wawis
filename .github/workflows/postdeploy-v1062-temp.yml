name: WAWIS 10.62 post-deploy verification

on:
  push:
    branches:
      - release/v10.62
    paths:
      - .github/workflows/postdeploy-v1062-temp.yml

permissions:
  contents: read

jobs:
  post-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v10.62

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify live production files
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 "https://wawis.pages.dev/app-version.json?release_check=$(date +%s)" -o /tmp/wawis-version.json
          curl -fsSL --max-time 20 "https://wawis.pages.dev/push-sw.js?release_check=$(date +%s)" -o /tmp/wawis-push-sw.js
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const versionText = fs.readFileSync('/tmp/wawis-version.json', 'utf8');
          const swText = fs.readFileSync('/tmp/wawis-push-sw.js', 'utf8');
          const version = String(JSON.parse(versionText).version || '').trim();
          if (version !== '10.62') throw new Error(`Produkcja ma wersję ${version || 'brak'}, oczekiwano 10.62`);
          if (!swText.includes('wawis-app-shell-v10.62')) throw new Error('Produkcja nie zawiera cache wawis-app-shell-v10.62');
          const sha = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const evidence = {
            schema_version: 1,
            version: '10.62',
            checked_at: new Date().toISOString(),
            production_url: 'https://wawis.pages.dev',
            production: {
              version_verified: true,
              service_worker_verified: true,
              app_version: version,
              service_worker_cache: 'wawis-app-shell-v10.62',
              app_version_sha256: sha(versionText),
              service_worker_sha256: sha(swText)
            },
            diagnostics: {
              checked: true,
              checked_at: '2026-09-15T04:44:13.117894Z',
              last_24h: true,
              result: 'GO',
              problematic_count: 0,
              last_24h_total_count: 3,
              last_24h_problematic_count: 3,
              since_deploy_total_count: 0,
              since_deploy_problematic_count: 0,
              deployment_started_at: '2026-09-15T04:40:22Z',
              source: 'Supabase production project uohziyaudbpwmupvljyd direct post-deploy query'
            }
          };
          fs.writeFileSync('post-deploy-evidence.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log(`WAWIS LIVE VERIFIED — ${version}`);
          NODE

      - name: Close release gate using live evidence
        run: node scripts/release-policy-gate.cjs --post --evidence post-deploy-evidence.json

      - name: Upload post-deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wawis-post-deploy-evidence-v10.62
          path: post-deploy-evidence.json
          if-no-files-found: error
          retention-days: 30
