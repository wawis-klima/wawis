name: Patch WAWIS 10.60 unassigned comment push once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-v1060-unassigned-comment-push.cjs'
      - '.github/workflows/patch-v1060-unassigned-comment-push-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: node scripts/patch-v1060-unassigned-comment-push.cjs

      - name: Regression smoke
        run: node scripts/smoke-worker-shared-job-edit-v1060.cjs

      - name: Commit patch
        run: |
          git config user.name "wawis-klima"
          git config user.email "wasik@wawis.pl"
          git rm scripts/patch-v1060-unassigned-comment-push.cjs
          git rm .github/workflows/patch-v1060-unassigned-comment-push-once.yml
          git add -A
          git commit -m "WAWIS 10.60: allow unassigned worker comment push"
          git push origin main
