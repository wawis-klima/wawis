name: WAWIS 10.62 prepare version

on:
  push:
    branches:
      - release/v10.62
    paths:
      - .github/workflows/prepare-v1062.yml

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v10.62

      - name: Bump 10.61 to 10.62
        shell: bash
        run: |
          CURRENT="$(node -p "require('./app-version.json').version")"
          if [ "$CURRENT" = "10.61" ]; then
            node version-bump.cjs
          elif [ "$CURRENT" = "10.62" ]; then
            echo "Version already prepared: $CURRENT"
          else
            echo "Unexpected release version: $CURRENT" >&2
            exit 1
          fi

      - name: Commit synchronized version files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No version changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-version.json public/app-version.json package.json package-lock.json src/version.js src/mobile791/version.js public/push-sw.js README.md CHANGELOG.md
          git commit -m "WAWIS 10.62 — synchronize release version"
          git push origin HEAD:release/v10.62
