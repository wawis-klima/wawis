name: WAWIS PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: wawis-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  targeted-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Detect changed files
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed-files.txt
          cat changed-files.txt

      - name: Run targeted regression groups
        run: node scripts/run-pr-checks.cjs changed-files.txt

  final-release-v1061:
    needs: targeted-checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Detect one-time final runner trigger
        id: trigger
        shell: bash
        run: |
          if git diff-tree --no-commit-id --name-only -r HEAD | grep -Fxq '.github/workflows/pr-checks.yml'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.trigger.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.trigger.outputs.run == 'true'
        run: npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Pre-release policy gate
        if: steps.trigger.outputs.run == 'true'
        run: node scripts/release-policy-gate.cjs

      - name: Install Chromium for Playwright
        if: steps.trigger.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run one final full release pass
        if: steps.trigger.outputs.run == 'true'
        run: node scripts/run-release.cjs full --skip-version-bump

      - name: Upload final ZIP and release report
        if: ${{ always() && steps.trigger.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: wawis-final-release-v10.61
          path: |
            releases/klima-app-v10.61.zip
            RELEASE-RESULT.md
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
