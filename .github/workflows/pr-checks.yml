name: WAWIS PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: wawis-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  targeted-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Complete WAWIS 10.83 README and CHANGELOG
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme = readme.replace(
              '# Wawis Klimatyzacja — wersja 10.75',
              '# Wawis Klimatyzacja — wersja 10.83',
              1,
          )
          readme = readme.replace(
              'Wersja 10.64 poprawia wyłącznie odstęp prawego przycisku inicjałów w mobilnym pasku akcji. PW jest odsunięte o dodatkowe 6 px od prawej krawędzi; desktop i logika aplikacji pozostają bez zmian.',
              'Wersja 10.83 domyka bezpieczeństwo sesji i PUSH przy zmianie konta, trwałą historię unieważnionych lifecycle, bezpieczne powiadomienia o tankowaniu oraz obowiązkową prawdziwą bramkę Playwright E2E. Dodatkowo chroni lokalne zdjęcia oczekujące na synchronizację przed nadpisaniem przez spóźniony refresh sesji.',
              1,
          )
          placeholder = '- wersja `10.83` — uzupełnij opis ostatniej poprawki po zakończeniu zmian.'
          final_line = '- wersja `10.83` — bezpieczeństwo sesji i PUSH A→B, trwałe tombstone lifecycle, bezpieczny push tankowania, prawdziwy Playwright w obowiązkowej bramce oraz ochrona lokalnych zdjęć przed spóźnionym refreshem.'
          if placeholder not in readme:
              raise SystemExit('README 10.83 placeholder not found')
          readme = readme.replace(placeholder, final_line, 1)
          readme_path.write_text(readme)

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          old = '## 10.83\n- uzupełnij opis zmian dla wersji 10.83\n'
          new = '''## 10.83
- F12: obowiązkowa bramka PR uruchamia rzeczywisty Playwright E2E wskazany przez klasyfikację ryzyka zamiast ograniczać się do statycznych smoke testów,
- F3/F4/F10: sesja Auth i lifecycle PUSH są tokenizowane/ograniczone czasowo, dzięki czemu spóźnione operacje konta A nie mogą przywrócić kontekstu ani stanu po przejściu na konto B,
- F11: prywatna tabela tombstone przechowuje historię unieważnionych lifecycle PUSH niezależnie od aktualnego właściciela endpointu; RPC synchronizacji odrzuca stare tokeny,
- F6: push po tankowaniu zawiera recipientUserId i subscriptionGeneration, ma ogólną treść oraz dezaktywuje wygasły endpoint tylko przy zgodności właściciela i generacji,
- nowa bramka E2E wykryła i domknęła wyścig restartu/offline: spóźniony pełny refresh nie może już nadpisać lokalnego zdjęcia odtworzonego z IndexedDB,
- ustabilizowano desktopowy test geometrii kreatora urządzeń tak, aby nie zależał od automatycznego przejścia statusu Nowe → Niezrealizowane.
'''
          if old not in changelog:
              raise SystemExit('CHANGELOG 10.83 placeholder not found')
          changelog = changelog.replace(old, new, 1)
          changelog_path.write_text(changelog)
          PY

          git diff --check
          if git diff --quiet -- README.md CHANGELOG.md; then
            echo "10.83 metadata already complete"
            exit 0
          fi
          git config user.name 'wawis-klima'
          git config user.email 'wasik@wawis.pl'
          git add README.md CHANGELOG.md
          git commit -m 'docs: complete WAWIS 10.83 release metadata'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
