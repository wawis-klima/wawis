name: WAWIS PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: wawis-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  targeted-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prepare 10.84 fixes and version metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/prepare-v1084.cjs')
          source = path.read_text()

          old = "patchBlock(path, '  const reloadJobDetails = React.useCallback(async (jobId, options = {}) => {', '\\n\\n  const scheduleBackgroundJobDetailsReload', (block) => {"
          new = "patchBlock(path, '  const reloadJobDetails = React.useCallback(async (jobId, options = {}) => {', mobile ? '\\n\\n  const scheduleBackgroundJobDetailsReload' : '\\n\\n  const reloadJobSummary', (block) => {"
          if old not in source:
              raise SystemExit('Nie znaleziono oczekiwanego wzorca patchera reloadJobDetails')
          source = source.replace(old, new, 1)

          old = "  replaceOnce(path, `  }, [supabase]);\\n\\n  const reloadJobDetails`, `  }, [captureCurrentSessionToken, isSessionTokenCurrent, supabase]);\\n\\n  const reloadJobDetails`, 'thumbnail dependencies');"
          new = (
              "  const thumbnailNext = mobile ? '\\n\\n  const recoverPhotoThumbnail' : '\\n\\n  const reloadJobDetails';\n"
              "  replaceOnce(path, `  }, [supabase]);${thumbnailNext}`, `  }, [captureCurrentSessionToken, isSessionTokenCurrent, supabase]);${thumbnailNext}`, 'thumbnail dependencies');"
          )
          if old not in source:
              raise SystemExit('Nie znaleziono oczekiwanego wzorca zależności miniaturek')
          source = source.replace(old, new, 1)

          path.write_text(source)
          PY
          node scripts/prepare-v1084.cjs

      - name: Commit candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: WAWIS 10.84 audit race closure'
          git push origin HEAD:${{ github.head_ref }}

      - name: Install dependencies
        run: npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Detect changed files
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed-files.txt
          cat changed-files.txt

      - name: Classify effective release impact
        id: impact
        shell: bash
        run: node scripts/release-impact.cjs --base-ref "origin/${{ github.base_ref }}" --json release-impact.json --github-output "$GITHUB_OUTPUT"

      - name: Run focused 10.84 regression
        run: node scripts/smoke-audit-races-v1084.mjs

      - name: Run targeted regression groups
        run: node scripts/run-pr-checks.cjs changed-files.txt release-impact.json

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run dedicated 10.84 browser race regression
        run: npx playwright test tests/e2e/audit-races-v1084.spec.js --reporter=line

      - name: Run required Playwright E2E
        if: steps.impact.outputs.needs_playwright == 'true'
        run: node scripts/run-pr-playwright.cjs release-impact.json

      - name: Production build
        run: npm run build

      - name: Finalize clean release branch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const gate = JSON.parse(fs.readFileSync('RELEASE-GATE.json', 'utf8'));
          gate.main_protection.ready_for_main = true;
          gate.predeploy_diagnostics = {
            checked: true,
            last_24h: true,
            checked_at: '2026-09-16T15:57:00+02:00',
            result: 'INFO_ONLY',
            notes: '10.84: finalny gate, regresje, Chromium E2E i build zakończone przed merge.'
          };
          fs.writeFileSync('RELEASE-GATE.json', JSON.stringify(gate, null, 2) + '\n');
          NODE
          git checkout origin/main -- .github/workflows/pr-checks.yml
          git rm scripts/prepare-v1084.cjs
          git diff --check
          node scripts/verify-release.cjs
          bash scripts/deploy-gate-router.sh
          git add -A
          git commit -m 'release: finalize WAWIS 10.84 candidate'
          git push origin HEAD:${{ github.head_ref }}
