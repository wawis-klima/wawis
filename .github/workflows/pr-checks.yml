name: WAWIS PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: wawis-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  targeted-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Detect changed files
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed-files.txt
          cat changed-files.txt

      - name: Run targeted regression groups
        run: node scripts/run-pr-checks.cjs changed-files.txt
