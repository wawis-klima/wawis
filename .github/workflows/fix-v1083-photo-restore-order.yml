name: Fix v10.83 queued photo restore ordering

on:
  push:
    branches:
      - tmp-v1083-apply

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-v1083-apply
          fetch-depth: 0

      - name: Restore queued photos only after jobs exist
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/mobile791/App.jsx')
          text = path.read_text()
          old = """  const offlineSyncUserId = String(profile?.id || sessionUser?.id || '').trim();\n  const offlineSyncProfileId = String(profile?.id || '').trim();\n  const hasPendingOfflineWork = (\n"""
          new = """  const offlineSyncUserId = String(profile?.id || sessionUser?.id || '').trim();\n  const offlineSyncProfileId = String(profile?.id || '').trim();\n  const offlineSyncJobCount = Array.isArray(jobs) ? jobs.length : 0;\n  const hasPendingOfflineWork = (\n"""
          if old in text:
              text = text.replace(old, new, 1)
          elif 'const offlineSyncJobCount = Array.isArray(jobs) ? jobs.length : 0;' not in text:
              raise SystemExit('offline sync counters block not found')

          old = """      const currentProfile = offlineSyncContextRef.current.profile;\n      if (!currentProfile) return;\n      if (offlinePhotoQueueUserRef.current !== userId) {\n        offlinePhotoQueueUserRef.current = userId;\n        await restorePersistedJobPhotos({\n"""
          new = """      const currentProfile = offlineSyncContextRef.current.profile;\n      if (!currentProfile) return;\n      const currentJobs = offlineSyncContextRef.current.jobs;\n      const hasJobsReady = Array.isArray(currentJobs) && currentJobs.length > 0;\n      if (offlinePhotoQueueUserRef.current !== userId && hasJobsReady) {\n        // Nie oznaczamy kolejki jako odtworzonej, dopóki lista zleceń nie istnieje.\n        // Inaczej lokalne zdjęcie z IndexedDB nie ma jeszcze karty, do której można je podpiąć,\n        // a kolejny refresh nie podejmuje już drugiej próby.\n        offlinePhotoQueueUserRef.current = userId;\n        await restorePersistedJobPhotos({\n"""
          if old in text:
              text = text.replace(old, new, 1)
          elif 'const hasJobsReady = Array.isArray(currentJobs) && currentJobs.length > 0;' not in text:
              raise SystemExit('restore queue block not found')

          old = """  }, [offlineSyncUserId, offlineSyncProfileId, hasPendingOfflineWork, supabase, setJobs, setSelectedJob, scheduleBackgroundJobDetailsReload, performOfflineJobSync, photoSyncStatus.markPhotoSyncError, photoSyncStatus.markPhotoSynced, photoSyncStatus.markPhotoSyncing]);\n"""
          new = """  }, [offlineSyncUserId, offlineSyncProfileId, offlineSyncJobCount, hasPendingOfflineWork, supabase, setJobs, setSelectedJob, scheduleBackgroundJobDetailsReload, performOfflineJobSync, photoSyncStatus.markPhotoSyncError, photoSyncStatus.markPhotoSynced, photoSyncStatus.markPhotoSyncing]);\n"""
          if old in text:
              text = text.replace(old, new, 1)
          elif 'offlineSyncJobCount, hasPendingOfflineWork' not in text:
              raise SystemExit('offline sync effect dependencies not found')
          path.write_text(text)

          smoke = Path('scripts/smoke-mobile-offline-photo-queue.cjs')
          smoke_text = smoke.read_text()
          guards = [
            "assert(app.includes('const offlineSyncJobCount = Array.isArray(jobs) ? jobs.length : 0;'), 'Odtwarzanie kolejki musi ponowić się, gdy pojawi się lista zleceń.');\n",
            "assert(app.includes('offlinePhotoQueueUserRef.current !== userId && hasJobsReady'), 'Kolejka nie może zostać oznaczona jako odtworzona przed załadowaniem zleceń.');\n",
          ]
          marker = "assert(app.includes('restorePersistedJobPhotos'), 'Brak odtwarzania kolejki po ponownym uruchomieniu aplikacji.');\n"
          for guard in guards:
              if guard not in smoke_text:
                  smoke_text = smoke_text.replace(marker, marker + guard, 1)
                  marker = guard
          smoke.write_text(smoke_text)
          PY
          git diff --check

      - name: Verify focused offline queue smoke
        run: node scripts/smoke-mobile-offline-photo-queue.cjs

      - name: Commit source fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'wawis-klima'
          git config user.email 'wasik@wawis.pl'
          git add src/mobile791/App.jsx scripts/smoke-mobile-offline-photo-queue.cjs
          git commit -m 'fix: restore queued photos after jobs hydrate'
          git push origin HEAD:tmp-v1083-apply
