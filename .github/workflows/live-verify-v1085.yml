name: WAWIS 10.85 one-shot live verification

on:
  push:
    branches:
      - release/v10.85
    paths:
      - .github/workflows/live-verify-v1085.yml

permissions:
  contents: read

jobs:
  live-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production app-version and service worker
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://wawis-klima.vercel.app'
          CACHE_BUST="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          curl -fsS --retry 5 --retry-delay 2 --max-time 20 -H 'Cache-Control: no-cache' "${BASE}/app-version.json?verify=${CACHE_BUST}" -o /tmp/app-version.json
          echo '--- LIVE app-version.json ---'
          cat /tmp/app-version.json
          node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('/tmp/app-version.json','utf8')).version; if(v!=='10.85') throw new Error('Expected live 10.85, got '+v); console.log('LIVE_VERSION='+v)"

          curl -fsS --retry 5 --retry-delay 2 --max-time 20 -H 'Cache-Control: no-cache' "${BASE}/push-sw.js?verify=${CACHE_BUST}" -o /tmp/push-sw.js
          echo '--- LIVE service worker cache marker ---'
          grep -o 'wawis-app-shell-v10\.85' /tmp/push-sw.js | head -1
          grep -q 'wawis-app-shell-v10\.85' /tmp/push-sw.js
          echo 'LIVE_SW_CACHE=wawis-app-shell-v10.85'

          curl -fsS --retry 5 --retry-delay 2 --max-time 20 -o /dev/null "${BASE}/"
          echo 'LIVE_HOME=HTTP_OK'
