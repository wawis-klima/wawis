name: WAWIS 10.66 runtime refresh hotfix

on:
  push:
    branches: [runner/v10.66]
    paths:
      - .github/workflows/v1066-runtime-refresh-hotfix.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v10.66
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure version 10.66 and documentation
        run: |
          node <<'NODE'
          const fs = require('fs')
          let version = JSON.parse(fs.readFileSync('app-version.json', 'utf8')).version
          if (version === '10.65') {
            require('./version-bump.cjs').bumpVersion()
            version = JSON.parse(fs.readFileSync('app-version.json', 'utf8')).version
          }
          if (version !== '10.66') throw new Error(`Expected 10.66, got ${version}`)
          fs.writeFileSync('release-notes.json', JSON.stringify({
            version,
            summary: 'Aplikacja na iPhonie sprawdza nową wersję także po powrocie z tła i sama odświeża się, gdy produkcja jest nowsza.',
            changes: [
              'Sprawdzanie app-version.json przy pageshow, focus, online i visibilitychange.',
              'Odczyt wersji z cache: no-store i cache-bustingiem.',
              'Przy wykryciu nowszej wersji Service Worker jest aktualizowany, a aplikacja automatycznie przeładowywana.',
              'Zachowany 24 px prawy odstęp PW z 10.65.'
            ]
          }, null, 2) + '\n')
          let readme = fs.readFileSync('README.md', 'utf8')
          readme = readme.replace(/- wersja `10\.66` — uzupełnij opis ostatniej poprawki po zakończeniu zmian\./, '- wersja `10.66` — automatyczne odświeżanie wersji po powrocie aplikacji z tła na iPhonie.')
          fs.writeFileSync('README.md', readme)
          let changelog = fs.readFileSync('CHANGELOG.md', 'utf8')
          changelog = changelog.replace('## 10.66\n- uzupełnij opis zmian dla wersji 10.66', '## 10.66\n- iPhone/PWA: aplikacja sprawdza produkcyjne app-version.json po powrocie z tła i automatycznie przeładowuje nowszą wersję.\n- Dodano cache-busting i cache: no-store dla kontroli wersji.\n- Zachowano poprawkę 24 px prawego odstępu PW z 10.65.')
          fs.writeFileSync('CHANGELOG.md', changelog)
          NODE

      - name: Commit release metadata when needed
        run: |
          git config user.name "wawis-klima"
          git config user.email "wasik@wawis.pl"
          git add app-version.json public/app-version.json package.json package-lock.json src/version.js src/mobile791/version.js public/push-sw.js README.md CHANGELOG.md release-notes.json
          if ! git diff --cached --quiet; then
            git commit -m "WAWIS 10.66 — synchronizuj wersję i metadane"
            git push origin HEAD:release/v10.66
          fi

      - name: Verify resume update guard
        run: |
          node <<'NODE'
          const fs = require('fs')
          const source = fs.readFileSync('src/main.jsx', 'utf8')
          const required = [
            "import { APP_VERSION } from './version.js'",
            "fetch(`/app-version.json?wawis_version_check=${now}`",
            "cache: 'no-store'",
            "window.addEventListener('pageshow'",
            "window.addEventListener('focus'",
            "document.addEventListener('visibilitychange'",
            "window.addEventListener('online'",
            "registration?.update?.()",
            "window.location.reload()",
          ]
          for (const token of required) {
            if (!source.includes(token)) throw new Error(`Missing runtime update guard token: ${token}`)
          }
          console.log('Runtime version refresh guard: OK')
          NODE

      - name: Core regression
        run: node scripts/run-test-group.cjs core

      - name: Mobile regression
        run: node scripts/run-test-group.cjs mobile

      - name: Build once
        run: npm run build

      - name: Verify bundle
        run: npm run verify:bundle

      - name: Verify mobile CSS bundle
        run: npm run test:smoke:dist-mobile-css

      - name: Write release result
        run: node scripts/write-release-result.cjs --variant targeted

      - name: Verify release
        run: npm run verify:release

      - name: Package release
        run: |
          npm run zip:release
          node scripts/verify-release.cjs --require-zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: wawis-final-release-v10.66
          path: |
            releases/klima-app-v10.66.zip
            RELEASE-RESULT.md
          retention-days: 14
