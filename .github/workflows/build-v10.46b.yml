name: Build Wawis 10.46 verified refactor

on:
  push:
    branches:
      - build-v10.46

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: build-v10.46

      - name: Apply refactor
        run: python3 scripts/refactor-v1046.py

      - name: Remove temporary build helpers
        run: |
          rm -f scripts/refactor-v1046.py
          rm -f .github/workflows/build-v10.46b.yml

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Fuel smoke test
        run: npm run test:smoke:fuel-module

      - name: Mobile style bootstrap smoke test
        run: npm run test:smoke:mobile-style-bootstrap

      - name: Commit verified refactor
        run: |
          git config user.name "wawis-klima"
          git config user.email "wasik@wawis.pl"
          git add -A
          git commit -m "Wawis 10.46: stabilize fuel UI and consolidate mobile styles"
          git push origin HEAD:build-v10.46
