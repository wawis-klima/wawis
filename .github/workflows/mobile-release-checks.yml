name: Mobile release checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  npm_config_registry: https://registry.npmjs.org/

jobs:
  verify-mobile-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Read application version
        id: app-version
        shell: bash
        run: echo "version=$(node -p \"require('./app-version.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Run full mobile release verification
        run: npm run release:mobile -- --skip-version-bump

      - name: Upload verified release package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wawis-mobile-${{ steps.app-version.outputs.version }}
          path: |
            releases/klima-app-v${{ steps.app-version.outputs.version }}.zip
            RELEASE-RESULT.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ steps.app-version.outputs.version }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Release summary
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## ZIELONY — mobilne wydanie ${{ steps.app-version.outputs.version }} przeszło pełną weryfikację." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## CZERWONY — mobilne wydanie ${{ steps.app-version.outputs.version }} nie przeszło pełnej weryfikacji." >> "$GITHUB_STEP_SUMMARY"
            echo "Nie publikuj tej wersji." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mark failed release explicitly
        if: failure()
        run: echo "CZERWONY — Nie publikuj tej wersji."
