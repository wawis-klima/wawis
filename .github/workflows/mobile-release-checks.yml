name: Mobile release checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  npm_config_registry: https://registry.npmjs.org/
  NPM_CONFIG_INCLUDE: optional
  NPM_CONFIG_AUDIT: false
  NPM_CONFIG_FUND: false

jobs:
  mobile-release:
    name: Mobile release runner
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Read application version
        id: app-version
        shell: bash
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies from public npm
        run: npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile release checks twice, build and package
        run: npm run release:mobile -- --skip-version-bump

      - name: Upload verified mobile release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: klima-app-mobile-v${{ steps.app-version.outputs.version }}
          path: releases/klima-app-v${{ steps.app-version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload release result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-result-v${{ steps.app-version.outputs.version }}
          path: RELEASE-RESULT.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload visual verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-visual-verification-v${{ steps.app-version.outputs.version }}
          path: visual-artifacts/*.png
          if-no-files-found: ignore

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-playwright-diagnostics-v${{ steps.app-version.outputs.version }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish green or red summary
        if: always()
        shell: bash
        run: |
          VERSION="${{ steps.app-version.outputs.version }}"
          if [ "${{ job.status }}" = "success" ]; then
            echo "## ✅ Mobile v${VERSION} — ZIELONY" >> "$GITHUB_STEP_SUMMARY"
            echo "Testy mobilne x2, Playwright, build x2 i kontrola ZIP-a zakończyły się poprawnie." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Mobile v${VERSION} — CZERWONY" >> "$GITHUB_STEP_SUMMARY"
            echo "Co najmniej jeden test, Playwright, build albo kontrola ZIP-a zakończyły się błędem." >> "$GITHUB_STEP_SUMMARY"
          fi
