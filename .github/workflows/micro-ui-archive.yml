name: WAWIS micro UI archive

on:
  push:
    branches: [main]

concurrency:
  group: wawis-micro-ui-archive-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout production commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect MICRO UI commit
        id: micro
        shell: bash
        run: |
          node scripts/micro-ui-policy.cjs --base-ref HEAD^1 --json MICRO-UI-IMPACT.json --github-output "$GITHUB_OUTPUT" || true
          cat MICRO-UI-IMPACT.json || true

      - name: Create deferred source ZIP
        if: steps.micro.outputs.micro_ui == 'true'
        shell: bash
        run: |
          VERSION="$(node -p "require('./app-version.json').version")"
          mkdir -p releases
          zip -rq "releases/klima-app-v${VERSION}.zip" . \
            -x '.git/*' 'node_modules/*' 'dist/*' 'releases/*' 'playwright-report/*' 'test-results/*'
          ls -lh "releases/klima-app-v${VERSION}.zip"

      - name: Upload deferred MICRO UI archive
        if: steps.micro.outputs.micro_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wawis-micro-ui-archive-${{ github.sha }}
          path: releases/klima-app-v*.zip
          if-no-files-found: error
          retention-days: 30
