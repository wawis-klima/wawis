name: WAWIS 10.70 toolbar geometry temp

on:
  push:
    branches:
      - release/v10.70

permissions:
  contents: write

jobs:
  verify-and-prepare:
    if: github.event.head_commit.message != 'WAWIS 10.70: przygotuj zweryfikowane wydanie'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Static mobile header smoke
        run: npm run test:smoke:mobile-admin-header

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Real iPhone toolbar geometry
        env:
          VITE_SUPABASE_MODE: mock
        run: npx playwright test tests/e2e/release-visual-checks.spec.js --config playwright.config.js --grep "nagłówek mobilny ma realnie równy odstęp" --workers 1

      - name: Bump version to 10.70
        run: node version-bump.cjs

      - name: Version smoke
        run: npm run test:smoke:version

      - name: Build
        run: npm run build

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/v1070-toolbar-geometry-temp.yml
          git config user.name 'wawis-klima'
          git config user.email 'wasik@wawis.pl'
          git add -A
          git commit -m 'WAWIS 10.70: przygotuj zweryfikowane wydanie'
          git push origin HEAD:release/v10.70
