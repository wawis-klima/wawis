name: WAWIS 10.86 repair hardening test

on:
  push:
    branches:
      - release/v10.86
    paths:
      - .github/workflows/repair-harden-v1086-test.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v10.86
      - name: Update hardening workflow smoke migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/harden-v1086-session.yml')
          s = p.read_text()
          marker = "          smoke = smoke_path.read_text()\n"
          insert = "          smoke = smoke_path.read_text()\n          smoke = smoke.replace(\"assert.equal(session.includes('const requestEntry = { request, requestId };'), true, 'actual fetch must own requestId');\", \"assert.equal(session.includes('return getOrCreateRefreshPayloadRequest('), true, 'refresh hook must use request-entry contract helper');\", 1)\n"
          if marker not in s:
              raise SystemExit('hardening smoke marker not found')
          p.write_text(s.replace(marker, insert, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/harden-v1086-session.yml
          git commit -m '10.86: update F8 regression after contract extraction'
          git push origin HEAD:release/v10.86
