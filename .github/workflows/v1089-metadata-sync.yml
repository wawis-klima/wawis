name: WAWIS v10.89 Metadata Sync

on:
  push:
    branches:
      - release/v10.89

permissions:
  contents: write

concurrency:
  group: wawis-v1089-metadata-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v10.89
          fetch-depth: 0

      - name: Synchronize exact 10.89 metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { writeVersion } = require('./version-bump.cjs');
          const version = '10.89';
          writeVersion(version);

          const summary = 'N7: odtwarzalny backend z repozytorium oraz bezpieczny dostęp pracownika do danych kontrahenta — odczyt i kontrolowana aktualizacja nazwy, telefonu, e-mailu i adresu bez prawa usuwania ani szerokiego UPDATE tabeli.';

          let readme = fs.readFileSync('README.md', 'utf8');
          readme = readme.replace(/## Aktualna wersja\s*\r?\n-\s*[0-9]+\.[0-9]{2}/m, `## Aktualna wersja\n- ${version}`);
          readme = readme.replace(/^# Wawis Klimatyzacja — wersja\s+[0-9]+\.[0-9]{2}/m, `# Wawis Klimatyzacja — wersja ${version}`);
          const lastFixLine = `## Ostatnia poprawka\n- wersja \`${version}\` — ${summary}`;
          if (/## Ostatnia poprawka\s*\r?\n- wersja\s*`?[0-9]+\.[0-9]{2}`?.*/m.test(readme)) {
            readme = readme.replace(/## Ostatnia poprawka\s*\r?\n- wersja\s*`?[0-9]+\.[0-9]{2}`?.*/m, lastFixLine);
          } else {
            readme += `\n\n${lastFixLine}\n`;
          }
          fs.writeFileSync('README.md', readme);

          let changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const section = `## ${version}\n- N7: repozytorium zawiera deterministyczny zestaw plików rebuild Supabase odtwarzający zweryfikowany backend stagingowy.\n- Pracownik może odczytywać dane kontrahenta potrzebne do obsługi montaży.\n- Pracownik może przez kontrolowaną ścieżkę montażu aktualizować nazwę klienta, telefon, e-mail oraz adres główny; dodatkowe adresy i pola administracyjne pozostają zachowane.\n- Bezpośredni INSERT/UPDATE/DELETE tabeli contractors nie został otwarty dla pracownika; usuwanie kontrahenta pozostaje wyłącznie administracyjne.\n- Dodano regresję pilnującą zakresu worker update i blokady bezpośrednich zapisów.\n\n`;
          const re = new RegExp(`^## ${version.replace('.', '\\.')}\\r?\\n[\\s\\S]*?(?=^##\\s|$)`, 'm');
          if (re.test(changelog)) changelog = changelog.replace(re, section.trimEnd() + '\n\n');
          else changelog = section + changelog.replace(/^\s+/, '');
          fs.writeFileSync('CHANGELOG.md', changelog);

          const gate = JSON.parse(fs.readFileSync('RELEASE-GATE.json', 'utf8'));
          gate.version = version;
          gate.scope = 'full';
          gate.release_branch = `release/v${version}`;
          gate.baseline_diagnostics = {
            checked: true,
            last_24h: true,
            checked_at: new Date().toISOString(),
            result: 'INFO',
            notes: '10.89 N7: staging rebuild doprowadzony do zweryfikowanej zgodności semantycznej; runtime RLS pracownika i kontrolowana aktualizacja danych kontrahenta sprawdzone z rollback.'
          };
          gate.predeploy_diagnostics = {
            checked: true,
            last_24h: true,
            checked_at: new Date().toISOString(),
            result: 'FOCUSED_PASS_FULL_PR_PENDING',
            notes: 'Worker contractor read + contact update przeszły na stagingu; finalny WAWIS PR checks / targeted-checks pozostaje obowiązkowy przed merge.'
          };
          gate.main_protection = {
            source_branch: `release/v${version}`,
            ready_for_main: true,
            required_check: 'WAWIS PR checks / targeted-checks'
          };
          gate.postdeploy_diagnostics = {
            evidence_required: true,
            result: 'PENDING',
            notes: 'Po merge wymagane zastosowanie wyłącznie standardowych migracji 10.89 do produkcji, Vercel SUCCESS na SHA main i live-check wersji 10.89.'
          };
          gate.release_mode = 'standard';
          fs.writeFileSync('RELEASE-GATE.json', JSON.stringify(gate, null, 2) + '\n');
          NODE

      - name: Commit synchronized metadata
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Metadata already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-version.json public/app-version.json package.json package-lock.json src/version.js src/mobile791/version.js public/push-sw.js README.md CHANGELOG.md RELEASE-GATE.json
          git commit -m "chore(release): finalize v10.89 metadata"
          git push origin HEAD:release/v10.89
