name: WAWIS 10.71 fast release temp

on:
  push:
    branches:
      - release/v10.71
    paths:
      - .github/workflows/v1071-fast-release-temp.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/v10.71
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Remove temporary workflow from release tree
        run: rm -f .github/workflows/v1071-fast-release-temp.yml

      - name: Prepare version 10.71 metadata
        run: |
          node version-bump.cjs
          node <<'NODE'
          const fs = require('fs');
          const version = JSON.parse(fs.readFileSync('app-version.json','utf8')).version;
          if (version !== '10.71') throw new Error(`Expected 10.71, got ${version}`);

          let readme = fs.readFileSync('README.md','utf8');
          readme = readme.replace(
            /## Ostatnia poprawka\s*\n- wersja `10\.71` — uzupełnij opis ostatniej poprawki po zakończeniu zmian\./m,
            '## Ostatnia poprawka\n- wersja `10.71` — skrajne odstępy mobilnego paska zmniejszono z 12 px do 6 px; odzyskane miejsce zwiększa odstępy pomiędzy ikonami bez zmiany ich rozmiaru.'
          );
          fs.writeFileSync('README.md', readme);

          let changelog = fs.readFileSync('CHANGELOG.md','utf8');
          changelog = changelog.replace(
            /## 10\.71\n- uzupełnij opis zmian dla wersji 10\.71/m,
            '## 10.71\n- skrajne odstępy mobilnego paska zmniejszono z 12 px do 6 px; ikony zachowują dotychczasowy rozmiar, a dodatkowa przestrzeń trafia pomiędzy kontrolki.'
          );
          fs.writeFileSync('CHANGELOG.md', changelog);

          const checkedAt = '2026-09-15T17:13:17.191819Z';
          const gate = {
            policy_enforced_from: '10.60',
            version: '10.71',
            scope: 'mobile',
            release_branch: 'release/v10.71',
            baseline_diagnostics: {
              checked: true,
              last_24h: true,
              checked_at: checkedAt,
              result: 'GO',
              notes: '24 h: 15 wcześniejszych warning/error; od wdrożenia 10.70 brak nowych problemów (0). Zmiana 10.71 dotyczy wyłącznie geometrii mobilnego paska.'
            },
            predeploy_diagnostics: {
              checked: true,
              last_24h: true,
              checked_at: checkedAt,
              result: 'GO',
              notes: 'Od wdrożenia 10.70 brak nowych warning/error (0). Skrajne odstępy 10.71 są weryfikowane realnym testem iPhone.'
            },
            drive_backup: {
              required: true,
              folder_path: 'Aplikacja/Wersje',
              folder_id: '1eufcE1gnbfw7t2IMmJwbcicrkaiaqu0S',
              file_name: 'klima-app-v10.71.zip',
              file_id: '',
              size_bytes: 0,
              uploaded: false,
              uploaded_at: null,
              verified: false,
              notes: 'Do uzupełnienia po zielonym szybkim release i uploadzie ZIP na Google Drive.'
            },
            main_protection: {
              source_branch: 'release/v10.71',
              ready_for_main: false,
              final_release_run_id: '',
              final_release_commit: '',
              notes: 'Oczekuje na zielony szybki release i backup Drive.'
            },
            postdeploy_diagnostics: {
              evidence_required: true,
              checked: false,
              last_24h: true,
              checked_at: null,
              result: 'PENDING',
              production_version_verified: false,
              service_worker_verified: false,
              evidence_file: 'post-deploy-evidence.json',
              notes: 'Do wykonania po produkcyjnym wdrożeniu 10.71.'
            }
          };
          fs.writeFileSync('RELEASE-GATE.json', JSON.stringify(gate, null, 2) + '\n');
          NODE

      - name: Pre-release gate
        run: node scripts/release-policy-gate.cjs

      - name: Targeted mobile header smokes
        run: |
          npm run test:smoke:mobile-admin-header
          npm run test:smoke:mobile-worker-add-client
          npm run test:smoke:version

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Real iPhone spacing test
        run: npx playwright test tests/e2e/release-visual-checks.spec.js --grep "nagłówek mobilny ma mniejsze"

      - name: Build
        run: npm run build

      - name: Create release ZIP
        run: npm run zip:release

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wawis-final-release-v10.71
          path: releases/klima-app-v10.71.zip
          if-no-files-found: error
          retention-days: 90

      - name: Commit release metadata and remove temp workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "WAWIS 10.71: przygotuj zweryfikowane wydanie" || true
          git push origin HEAD:release/v10.71
