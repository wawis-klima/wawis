name: Prepare v10.83 security push e2e

on:
  push:
    branches:
      - tmp-v1083-apply

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-v1083-apply
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply v10.83 implementation
        run: |
          python3 scripts/prepare-v1083.py
          python3 scripts/prepare-v1083-fix1.py
          python3 scripts/prepare-v1083-fix2.py

      - name: Bump version to 10.83
        shell: bash
        run: |
          test "$(node -p "require('./app-version.json').version")" = "10.82"
          node version-bump.cjs
          test "$(node -p "require('./app-version.json').version")" = "10.83"

      - name: Install dependencies
        run: npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Focused v10.83 regression
        run: |
          node scripts/smoke-session-push-gate-v1083.mjs
          node scripts/smoke-push-safety-v1078.mjs
          node scripts/smoke-push-logout-handoff-v1076.mjs
          npm run test:smoke:push-reliability
          npm run test:smoke:push-mobile-reassignment
          npm run test:smoke:fuel-module
          node scripts/smoke-session-sync-resilience-v1080.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: v10.83 browser race regression
        run: npx playwright test tests/e2e/session-push-isolation-v1083.spec.js --workers=1 --reporter=line

      - name: Targeted groups
        run: node scripts/run-test-group.cjs core push fuel roles infra mobile desktop

      - name: Production build
        run: npm run build

      - name: Verify candidate
        shell: bash
        run: |
          node --check scripts/run-pr-playwright.cjs
          node --check scripts/smoke-session-push-gate-v1083.mjs
          test "$(node -p "require('./package.json').version")" = "10.83"
          test "$(node -p "require('./public/app-version.json').version")" = "10.83"
          grep -q "wawis-app-shell-v10.83" public/push-sw.js
          git diff --check

      - name: Commit prepared candidate
        shell: bash
        run: |
          rm .github/workflows/prepare-v1083-security.yml
          rm scripts/prepare-v1083.py
          rm scripts/prepare-v1083-fix1.py
          rm scripts/prepare-v1083-fix2.py
          git config user.name "wawis-klima"
          git config user.email "wasik@wawis.pl"
          git add -A
          git commit -m "fix: WAWIS 10.83 session push and real E2E gate"
          git push origin HEAD:tmp-v1083-apply
