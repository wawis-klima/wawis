name: Diagnose WAWIS 10.83 Vercel build

on:
  push:
    branches:
      - fix/v10.83-vercel-diagnose

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=optional --registry=https://registry.npmjs.org/
      - name: Vercel deploy guard
        env:
          VERCEL: '1'
          VERCEL_ENV: production
          VERCEL_GIT_COMMIT_REF: main
        run: node scripts/vercel-deploy-guard.cjs
      - name: Standard deploy gate
        env:
          WAWIS_STANDARD_DEPLOY_GATE: node scripts/release-policy-gate.cjs --deploy
        run: bash scripts/deploy-gate-router.sh
      - name: Production build
        run: npm run build
