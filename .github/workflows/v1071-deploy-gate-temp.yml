name: WAWIS 10.71 deploy gate temp

on:
  push:
    branches:
      - release/v10.71
    paths:
      - .github/workflows/v1071-deploy-gate-temp.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/v10.71
      - name: Exact Vercel deploy gate
        run: node scripts/release-policy-gate.cjs --deploy
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/v1071-deploy-gate-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "WAWIS 10.71: potwierdź bramkę deployu" || true
          git push origin HEAD:release/v10.71
