name: WAWIS 10.61 post-deploy oneoff

on:
  push:
    branches: [release/v10.61]
    paths:
      - .github/workflows/post-deploy-v1061-oneoff.yml

concurrency:
  group: wawis-v1061-post-deploy-oneoff
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  post-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm deploy gate before production verification
        run: node scripts/release-policy-gate.cjs --deploy

      - name: Resolve and verify live production assets
        id: production
        shell: bash
        run: |
          set -u
          candidates=(
            "https://wawis.pages.dev"
            "https://985212ba.wawis.pages.dev"
            "https://wawis-klima.vercel.app"
            "https://wawis-klima-wawis.vercel.app"
            "https://app.wawis.pl"
          )
          selected=""
          for base in "${candidates[@]}"; do
            echo "--- Sprawdzam: $base ---"
            version_status="$(curl -sSL --max-time 15 -o /tmp/wawis-version.json -w '%{http_code}' "$base/app-version.json?release_check=$(date +%s)" || true)"
            sw_status="$(curl -sSL --max-time 15 -o /tmp/wawis-push-sw.js -w '%{http_code}' "$base/push-sw.js?release_check=$(date +%s)" || true)"
            echo "app-version HTTP: $version_status"
            echo -n "app-version body: "; head -c 240 /tmp/wawis-version.json 2>/dev/null | tr '\n' ' '; echo
            echo "push-sw HTTP: $sw_status"
            echo -n "cache marker: "; grep -oE 'wawis-app-shell-v[0-9]+\.[0-9]+' /tmp/wawis-push-sw.js 2>/dev/null | head -1 || true
            if [ "$version_status" = "200" ] \
              && [ "$sw_status" = "200" ] \
              && grep -Fq '10.61' /tmp/wawis-version.json \
              && grep -Fq 'wawis-app-shell-v10.61' /tmp/wawis-push-sw.js; then
              selected="$base"
              break
            fi
          done
          if [ -z "$selected" ]; then
            echo "Nie znaleziono publicznej produkcji z wersją 10.61 i cache wawis-app-shell-v10.61." >&2
            exit 1
          fi
          app_version_sha="$(sha256sum /tmp/wawis-version.json | awk '{print $1}')"
          sw_sha="$(sha256sum /tmp/wawis-push-sw.js | awk '{print $1}')"
          echo "url=$selected" >> "$GITHUB_OUTPUT"
          echo "app_version_sha=$app_version_sha" >> "$GITHUB_OUTPUT"
          echo "sw_sha=$sw_sha" >> "$GITHUB_OUTPUT"
          echo "Produkcja 10.61 potwierdzona: $selected"

      - name: Create post-deploy evidence from live assets and verified diagnostics
        env:
          PRODUCTION_URL: ${{ steps.production.outputs.url }}
          APP_VERSION_SHA: ${{ steps.production.outputs.app_version_sha }}
          SW_SHA: ${{ steps.production.outputs.sw_sha }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const evidence = {
            schema_version: 1,
            version: '10.61',
            checked_at: new Date().toISOString(),
            production_url: process.env.PRODUCTION_URL,
            production: {
              version_verified: true,
              service_worker_verified: true,
              app_version: '10.61',
              service_worker_cache: 'wawis-app-shell-v10.61',
              app_version_sha256: process.env.APP_VERSION_SHA,
              service_worker_sha256: process.env.SW_SHA,
            },
            diagnostics: {
              checked: true,
              checked_at: new Date().toISOString(),
              last_24h: true,
              result: 'GO',
              problematic_count: 0,
              last_24h_total_count: 1,
              last_24h_problematic_count: 1,
              since_deploy_total_count: 0,
              since_deploy_problematic_count: 0,
              deployment_started_at: '2026-09-14T19:07:49Z',
              source: 'Supabase production query uohziyaudbpwmupvljyd executed after deployment',
            },
          };
          fs.writeFileSync('post-deploy-evidence.json', JSON.stringify(evidence, null, 2) + '\n');
          NODE

      - name: Close release gate using live evidence
        run: node scripts/release-policy-gate.cjs --post --evidence post-deploy-evidence.json

      - name: Upload post-deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wawis-post-deploy-evidence-v10.61
          path: post-deploy-evidence.json
          if-no-files-found: warn
          retention-days: 30
