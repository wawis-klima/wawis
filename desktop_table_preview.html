<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Preview</title>
<style>
  body{margin:0;background:#eef3f9;font-family:Inter,Arial,sans-serif;color:#10203a}
  .page{width:1365px;height:768px;padding:20px 26px;box-sizing:border-box;background:linear-gradient(180deg,#eef3f9 0%,#f6f8fc 100%)}
  .layout{display:grid;grid-template-columns:860px 1fr;gap:22px;align-items:start}
  .card{background:#fff;border:1px solid #dce5f0;border-radius:28px;box-shadow:0 12px 28px rgba(15,35,69,.06)}
  .left{padding:18px 20px}
  .top{display:grid;grid-template-columns:300px 1fr;gap:18px;margin-bottom:18px}
  .box{height:80px;border:1px solid #d7e2ee;border-radius:24px;background:#fff}
  .actions{display:flex;gap:12px;align-items:center}
  .ver{padding:0 24px;height:54px;display:flex;align-items:center;border:1px solid #d7e2ee;border-radius:18px;font-weight:800}
  .icon{width:54px;height:54px;border:1px solid #d7e2ee;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
  .search,.user{height:62px;border:1px solid #d7e2ee;border-radius:18px;display:flex;align-items:center;padding:0 20px;color:#6c7b92;font-size:20px}
  h2{margin:16px 0 16px;font-size:52px;line-height:1;font-weight:800;transform:scale(.52);transform-origin:left top;height:28px}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th,td{padding:14px 10px;border-bottom:1px solid #e4e9f1;text-align:left;vertical-align:middle}
  th{background:#f5f8fc;color:#51627a;font-size:15px}
  td{font-size:16px}
  .client{width:21%;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status{width:14%;text-align:center}
  .address{width:36%}
  .installers{width:18%}
  .date{width:11%;white-space:nowrap;font-size:13px}
  .tag{display:inline-flex;align-items:center;justify-content:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.2;background:#fef3c7;border:1px solid #fcd34d;color:#92400e;min-width:96px}
  .addr{font-size:14px;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .badges{display:flex;gap:5px;align-items:center}
  .badge{width:22px;height:22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;border:1px solid #b7d4ff;background:#dcecff}
  .badge.a{background:#fef3c7;border-color:#fcd34d;color:#92400e}.badge.p{background:#ede9fe;border-color:#c4b5fd;color:#5b21b6}.badge.g{background:#dcfce7;border-color:#86efac;color:#166534}.badge.k{background:#fce7f3;border-color:#f9a8d4;color:#9d174d}
  .right{padding:0}
  .hint{padding:22px 20px;color:#55657c;font-size:18px}
</style>
</head>
<body>
<div class="page">
  <div class="layout">
    <div class="card left">
      <div class="top">
        <div class="box"></div>
        <div class="actions">
          <div class="ver">WERSJA 5.38</div>
          <div class="icon">+</div>
          <div class="icon">↻</div>
          <div class="icon">⇥</div>
        </div>
      </div>
      <div class="filters">
        <div class="search">Filtruj...</div>
        <div class="user">Piotr Wasik</div>
      </div>
      <h2>W trakcie</h2>
      <table>
        <thead>
          <tr>
            <th class="client">Klient</th>
            <th class="status">Status</th>
            <th class="address">Adres</th>
            <th class="installers">Instalatorzy</th>
            <th class="date">Data ↓</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="client">Sokołowski</td>
            <td class="status"><span class="tag">W trakcie</span></td>
            <td class="address"><div class="addr">Poręba, Roździeńskiego 34</div></td>
            <td class="installers"><div class="badges"><span class="badge a">MF</span><span class="badge p">PM</span></div></td>
            <td class="date">07.04.26</td>
          </tr>
          <tr>
            <td class="client">Jerzy Kustra</td>
            <td class="status"><span class="tag">W trakcie</span></td>
            <td class="address"><div class="addr">Mokrus, ?</div></td>
            <td class="installers"><div class="badges"><span class="badge g">KW</span><span class="badge k">KS</span></div></td>
            <td class="date">07.04.26</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="card right"><div class="hint">Kliknij dowolny wiersz w tabeli, aby zobaczyć szczegóły montażu.</div></div>
  </div>
</div>
</body>
</html>
